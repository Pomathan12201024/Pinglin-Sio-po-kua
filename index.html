
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#385C45">
    <title>一心二葉・坪心而唱</title>

    <style>
        :root {
            --forest: #385C45;
            --forest-dark: #263F32;
            --tea: #789477;
            --tea-light: #A9BBA0;
            --cream: #F5F4EC;
            --paper: #E9E8D8;
            --earth: #B9A47C;
            --text: #35463A;
            --muted: #718073;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            font-family:
                "Noto Sans TC",
                "Helvetica Neue",
                Arial,
                sans-serif;
            background: var(--cream);
            color: var(--text);
            text-align: center;
        }

        /* 語言切換 */

        .lang-toggle {
            position: absolute;
            z-index: 10;
            top: 25px;
            right: 30px;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 17px;
            border-radius: 30px;
            background: rgba(255,255,255,0.88);
            backdrop-filter: blur(10px);
            box-shadow: 0 3px 15px rgba(0,0,0,0.12);
        }

        .lang-toggle button {
            border: none;
            background: none;
            color: #89948A;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            padding: 3px;
            transition: color 0.2s;
        }

        .lang-toggle button.active {
            color: var(--forest);
        }

        .lang-toggle button:hover {
            color: var(--tea);
        }

        .lang-divider {
            color: #C3C9C1;
        }

        /* 首頁主視覺 */

        .banner {
            position: relative;
            width: 100%;
            min-height: 470px;
            height: 68vh;
            max-height: 680px;

            background-image:
                linear-gradient(
                    to bottom,
                    rgba(25, 48, 34, 0.12),
                    rgba(25, 48, 34, 0.30) 45%,
                    rgba(25, 48, 34, 0.68)
                ),
                url('images/photo_1.jpg');

            background-size: cover;
            background-position: center 55%;
            background-repeat: no-repeat;

            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 20px;
        }

        .banner-content {
            position: relative;
            z-index: 1;
            color: white;
            margin-top: 25px;
            animation: fadeIn 1.2s ease;
        }

        .banner-subtitle {
            font-size: 0.9rem;
            letter-spacing: 5px;
            margin-bottom: 20px;
            color: rgba(255,255,255,0.9);
        }

        .banner h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 700;
            letter-spacing: 5px;
            line-height: 1.4;
            margin: 0;
            text-shadow: 0 3px 15px rgba(0,0,0,0.4);
        }

        .banner-line {
            width: 55px;
            height: 3px;
            background: #D4DDBD;
            margin: 27px auto;
            border-radius: 5px;
        }

        .banner-description {
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.9);
        }

        /* 主要內容 */

        .main-content {
            padding: 65px 20px 75px;
            background: var(--cream);
        }

        .section-label {
            font-size: 0.8rem;
            letter-spacing: 4px;
            color: var(--tea);
            font-weight: 700;
            margin-bottom: 18px;
        }

        .intro-text {
            max-width: 660px;
            margin: 0 auto;
            font-size: 1.08rem;
            line-height: 2;
            color: #637064;
            letter-spacing: 0.5px;
            padding: 0 10px;
        }

        /* 主要按鈕 */

        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 17px;
            max-width: 380px;
            margin: 40px auto 0;
        }

        .main-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 13px;

            padding: 19px 22px;
            border-radius: 12px;

            background: var(--forest);
            color: white;
            text-decoration: none;

            font-size: 1.05rem;
            font-weight: 600;
            letter-spacing: 1px;

            box-shadow: 0 5px 14px rgba(56,92,69,0.16);

            transition:
                transform 0.25s,
                background 0.25s,
                box-shadow 0.25s;
        }

        .main-btn:hover {
            background: var(--forest-dark);
            transform: translateY(-3px);
            box-shadow: 0 9px 20px rgba(56,92,69,0.22);
        }

        .main-btn:active {
            transform: scale(0.97);
        }

        .main-btn.secondary {
            background: var(--tea);
        }

        .main-btn.secondary:hover {
            background: var(--forest);
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon svg {
            width: 23px;
            height: 23px;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* 頁尾 */

        .footer {
            padding: 35px 20px;
            background: var(--forest-dark);
            color: rgba(255,255,255,0.78);
            font-size: 0.83rem;
            line-height: 2;
        }

        .footer p {
            margin: 5px 0;
        }

        .footer .copyright {
            margin-top: 14px;
            font-size: 0.75rem;
            color: rgba(255,255,255,0.5);
        }

        .footer a {
            color: var(--tea-light);
            text-decoration: none;
        }

        .footer a:hover {
            color: white;
        }

        /* 動畫 */

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 手機版 */

        @media (max-width: 600px) {

            .lang-toggle {
                top: 18px;
                right: 17px;
                padding: 7px 13px;
            }

            .banner {
                min-height: 430px;
                height: 65vh;
                max-height: 560px;
                background-position: center center;
            }

            .banner-content {
                margin-top: 35px;
            }

            .banner h1 {
                font-size: 2rem;
                letter-spacing: 2px;
            }

            .banner-subtitle {
                font-size: 0.75rem;
                letter-spacing: 3px;
            }

            .banner-description {
                font-size: 0.8rem;
                letter-spacing: 2px;
            }

            .main-content {
                padding: 48px 20px 60px;
            }

            .intro-text {
                font-size: 0.98rem;
                line-height: 1.9;
            }

            .btn-container {
                max-width: 100%;
                margin-top: 32px;
            }

            .main-btn {
                font-size: 1rem;
                padding: 17px 15px;
            }

            .footer {
                padding: 30px 18px;
                font-size: 0.76rem;
            }
        }

        /* 鍵盤操作的可見焦點 */

        a:focus-visible,
        button:focus-visible {
            outline: 3px solid var(--earth);
            outline-offset: 4px;
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
                scroll-behavior: auto !important;
            }
        }

    </style>
</head>

<body>

    <!-- 語言切換 -->
    <div class="lang-toggle">
        <button id="btn-zh"
                class="active"
                onclick="setLang('zh')"
                aria-label="切換中文">
            中
        </button>

        <span class="lang-divider">|</span>

        <button id="btn-en"
                onclick="setLang('en')"
                aria-label="Switch to English">
            EN
        </button>
    </div>


    <!-- 首頁主視覺 -->
    <header class="banner">

        <div class="banner-content">

            <div class="banner-subtitle">
                PINGLIN · TAIWAN
            </div>

            <h1 data-i18n="title">
                一心二葉・坪心而唱
            </h1>

            <div class="banner-line"></div>

            <div class="banner-description"
                 data-i18n="bannerDescription">
                山林之聲・相褒之歌
            </div>

        </div>

    </header>


    <!-- 主要介紹 -->
    <main class="main-content">

        <div class="section-label">
            ABOUT THE PROJECT
        </div>

        <div class="intro-text" data-i18n="intro">
            歡迎來到坪林相褒歌的重組活動。在這裡，
            你可以先認識並聆聽 MV 當中的一些聲音元素，
            接著進入拼貼模式，將它們重新組合成屬於
            你的個人相褒歌。
        </div>


        <!-- 功能按鈕 -->
        <nav class="btn-container">

            <a href="intro.html" class="main-btn">

                <span class="btn-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                        <path d="M8 7h8M8 11h8"/>
                    </svg>
                </span>

                <span data-i18n="btnIntro">
                    認識聲音素材
                </span>

            </a>


            <a href="collage.html"
               class="main-btn secondary">

                <span class="btn-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M4 8h4l2 3h4l2-3h4"/>
                        <path d="M4 16h4l2-3h4l2 3h4"/>
                        <circle cx="4" cy="8" r="1.5"/>
                        <circle cx="20" cy="8" r="1.5"/>
                        <circle cx="4" cy="16" r="1.5"/>
                        <circle cx="20" cy="16" r="1.5"/>
                    </svg>
                </span>

                <span data-i18n="btnCollage">
                    進入相褒歌拼貼
                </span>

            </a>

        </nav>

    </main>


    <!-- 頁尾 -->
    <footer class="footer">

        <p data-i18n="footerWarning">
            🎧 最佳體驗：建議佩戴耳機，並確認手機已解除靜音模式。
        </p>

        <p data-i18n="footerContext">
            國立臺灣大學 音樂設計與創新應用 課程專案 |
            坪林茶業博物館 展演
        </p>

        <p class="copyright">
            © 2026 陳柏安. All rights reserved.
        </p>

    </footer>


    <!-- 中英文切換 -->
    <script>

        const dict = {

            zh: {
                title: '一心二葉・坪心而唱',

                bannerDescription: '山林之聲・相褒之歌',

                intro: '歡迎來到坪林相褒歌的重組活動。在這裡，你可以先認識並聆聽 MV 當中的一些聲音元素，接著進入拼貼模式，將它們重新組合成屬於你的個人相褒歌。',

                btnIntro: '認識聲音素材',

                btnCollage: '進入相褒歌拼貼',

                footerWarning: '🎧 最佳體驗：建議佩戴耳機，並確認手機已解除靜音模式。',

                footerContext: '國立臺灣大學 音樂設計與創新應用 課程專案 | 坪林茶業博物館 展演'
            },

            en: {
                title: 'Pinglin Sio-Po-Kua',

                bannerDescription: 'Voices of Nature · Songs of Pinglin',

                intro: 'Welcome to the Pinglin Sio-Po-Kua reconstruction experience. Explore and listen to the individual sound elements from the music video, then enter collage mode to recombine them into your own interpretation of Sio-Po-Kua.',

                btnIntro: 'Explore the Sounds',

                btnCollage: 'Enter Sio-Po-Kua Collage',

                footerWarning: '🎧 For the best experience, please wear headphones and disable silent mode.',

                footerContext: 'NTU Music Design and Innovative Applications Project | Pinglin Tea Museum Exhibition'
            }

        };


        function setLang(lang) {

            // 更新網頁語言
            document.documentElement.lang =
                lang === 'zh' ? 'zh-TW' : 'en';

            // 更新所有文字
            document.querySelectorAll('[data-i18n]')
                .forEach(el => {

                    const key = el.getAttribute('data-i18n');

                    if (dict[lang][key]) {
                        el.textContent = dict[lang][key];
                    }

                });


            // 更新按鈕狀態
            document.getElementById('btn-zh')
                .classList.toggle('active', lang === 'zh');

            document.getElementById('btn-en')
                .classList.toggle('active', lang === 'en');


            document.getElementById('btn-zh')
                .setAttribute('aria-pressed', lang === 'zh');

            document.getElementById('btn-en')
                .setAttribute('aria-pressed', lang === 'en');


            // 儲存語言設定
            try {
                localStorage.setItem('prefLang', lang);
            } catch (e) {
                // 若瀏覽器不允許儲存，仍可正常切換語言
            }

        }


        // 網頁載入時讀取語言設定
        let savedLang = 'zh';

        try {
            savedLang = localStorage.getItem('prefLang') || 'zh';
        } catch (e) {
            savedLang = 'zh';
        }

        if (!dict[savedLang]) {
            savedLang = 'zh';
        }

        setLang(savedLang);

    </script>

</body>
</html>
