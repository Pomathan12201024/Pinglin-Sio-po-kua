<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電音拼貼實驗計畫</title>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f7; color: #333; text-align: center; }
        /* 語言切換按鈕 */
        .lang-toggle { position: absolute; top: 15px; right: 20px; background: rgba(255,255,255,0.8); padding: 5px 10px; border-radius: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .lang-toggle span { cursor: pointer; padding: 0 5px; color: #888; }
        .lang-toggle span.active { color: #007aff; }
        
        .banner { width: 100%; height: 250px; background-color: #d1d1d6; background-image: url('images/banner.jpg'); background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; }
        .banner h1 { color: white; text-shadow: 2px 2px 8px rgba(0,0,0,0.6); font-size: 2rem; margin: 0; padding: 0 20px; }
        .intro-text { padding: 30px 20px; font-size: 1.1rem; line-height: 1.6; max-width: 600px; margin: 0 auto; color: #555; }
        .btn-container { display: flex; flex-direction: column; gap: 15px; padding: 20px; max-width: 300px; margin: 0 auto; }
        .main-btn { background-color: #007aff; color: white; text-decoration: none; padding: 15px 20px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.1s; }
        .main-btn:active { transform: scale(0.96); }
        .collage-btn { background-color: #34c759; }
        .footer {
            margin-top: 50px;
            padding: 30px 20px;
            background-color: #e5e5ea;
            color: #666;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        .footer p { margin: 5px 0; }
        .footer a { color: #007aff; text-decoration: none; }
    </style>
</head>
<body>

    <div class="lang-toggle">
        <span id="btn-zh" onclick="setLang('zh')">中</span> | 
        <span id="btn-en" onclick="setLang('en')">EN</span>
    </div>

    <div class="banner">
        <h1 data-i18n="title">電音拼貼實驗計畫</h1>
    </div>

    <div class="intro-text" data-i18n="intro">
        歡迎來到聲音的重組實驗。在這裡，你可以先認識並聆聽每一個被拆解的聲音元素，接著進入拼貼模式，將它們重新組合成屬於你的獨特節奏。
    </div>

    <div class="btn-container">
        <a href="intro.html" class="main-btn" data-i18n="btnIntro">📖 介紹原始素材</a>
        <a href="collage.html" class="main-btn collage-btn" data-i18n="btnCollage">🎛️ 進入電音拼貼</a>
    </div>

    <div class="footer">
        <p data-i18n="footerWarning">🎧 最佳體驗：建議佩戴耳機，並確認手機已解除靜音模式。</p>
        <p data-i18n="footerContext">國立臺灣大學 音樂設計與創新應用 課程專案 | 坪林茶業博物館 展演</p>
        <p>© 2026 陳柏安. All rights reserved.</p>
        <!-- 如果需要放連結，可以取消下方的註解並填入網址 -->
        <!-- <p><a href="你的連結" target="_blank">SoundCloud</a> | <a href="你的連結" target="_blank">YouTube</a></p> -->
    </div>

    <script>
        // 翻譯字典
        const dict = {
            'zh': {
                'title': '電音拼貼實驗計畫',
                'intro': '歡迎來到聲音的重組實驗。在這裡，你可以先認識並聆聽每一個被拆解的聲音元素，接著進入拼貼模式，將它們重新組合成屬於你的獨特節奏。',
                'btnIntro': '📖 介紹原始素材',
                'btnCollage': '🎛️ 進入電音拼貼',
                'footerWarning': '🎧 最佳體驗：建議佩戴耳機，並確認手機已解除靜音模式。', 'footerContext': '國立臺灣大學 音樂設計與創新應用 課程專案 | 坪林茶業博物館 展演' 
            },
            'en': {
                'title': 'Electronic Music Collage',
                'intro': 'Welcome to the sound reconstruction experiment. Here, you can explore individual sound elements before entering the collage mode to create your own unique rhythm.',
                'btnIntro': '📖 Meet the Sounds',
                'btnCollage': '🎛️ Enter Collage Mode',
                'footerWarning': '🎧 For the best experience, please wear headphones and disable silent mode.', 'footerContext': 'NTU Music Design and Innovative Applications Project | Pinglin Tea Museum Exhibition'
            }
        };

        function setLang(lang) {
            localStorage.setItem('prefLang', lang); // 存入手機記憶體
            
            // 更新文字
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.innerText = dict[lang][key];
            });

            // 更新按鈕顏色
            document.getElementById('btn-zh').className = lang === 'zh' ? 'active' : '';
            document.getElementById('btn-en').className = lang === 'en' ? 'active' : '';
        }

        // 網頁載入時，檢查並套用先前的語言設定
        const savedLang = localStorage.getItem('prefLang') || 'zh';
        setLang(savedLang);
    </script>
</body>
</html>
