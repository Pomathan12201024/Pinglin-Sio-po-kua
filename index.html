<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電音拼貼實驗計畫</title>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            text-align: center;
        }
        /* 頂部橫幅，你可以把 background-image 換成你的圖片 */
        .banner {
            width: 100%;
            height: 250px;
            background-color: #d1d1d6; 
            background-image: url('images/banner.jpg'); 
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .banner h1 {
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.6);
            font-size: 2rem;
            margin: 0;
            padding: 0 20px;
        }
        .intro-text {
            padding: 30px 20px;
            font-size: 1.1rem;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            color: #555;
        }
        .btn-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding: 20px;
            max-width: 300px;
            margin: 0 auto;
        }
        .main-btn {
            background-color: #007aff;
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }
        .main-btn:active {
            transform: scale(0.96);
        }
        .collage-btn {
            background-color: #34c759;
        }
    </style>
</head>
<body>

    <div class="banner">
        <h1>電音拼貼實驗計畫</h1>
    </div>

    <div class="intro-text">
        歡迎來到聲音的重組實驗。在這裡，你可以先認識並聆聽每一個被拆解的聲音元素，接著進入拼貼模式，將它們重新組合成屬於你的獨特節奏。
    </div>

    <div class="btn-container">
        <a href="intro.html" class="main-btn">📖 介紹原始素材</a>
        <a href="collage.html" class="main-btn collage-btn">🎛️ 進入電音拼貼</a>
    </div>

</body>
</html>
