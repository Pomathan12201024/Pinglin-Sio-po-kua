<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>電音拼貼</title>
    <!-- 引入 Tone.js 核心庫，這是對軌完美同步的關鍵 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #121212; /* 拼貼頁面使用深色模式更有電音感 */
            color: #fff;
            padding: 20px;
            padding-bottom: 100px;
        }
        .header {
            text-align: center;
            margin-bottom: 25px;
        }
        .header a {
            text-decoration: none;
            color: #0a84ff;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            margin-bottom: 10px;
        }
        
        /* 素材槽設計 (Slots) */
        .slot-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            max-width: 500px;
            margin: 0 auto;
        }
        .slot {
            background-color: #2c2c2e;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            border: 2px solid transparent;
            transition: border-color 0.2s;
        }
        .slot.active {
            border-color: #0a84ff;
            background-color: #1c1c1e;
        }
        .slot-info h3 {
            margin: 0 0 5px 0;
            font-size: 1.2rem;
        }
        .slot-info p {
            margin: 0;
            color: #8e8e93;
            font-size: 0.9rem;
        }
        
        /* 共同播放大按鈕 */
        .global-play-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(28, 28, 30, 0.95);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            border-top: 1px solid #333;
        }
        .btn-global-play {
            background-color: #30d158;
            color: black;
            font-size: 1.3rem;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 30px;
            border: none;
            width: 100%;
            max-width: 400px;
            opacity: 0.4;
            pointer-events: none; /* 預設不可點擊 */
            transition: all 0.3s;
        }
        .btn-global-play.ready {
            opacity: 1;
            pointer-events: auto;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(48, 209, 88, 0.4);
        }
        .btn-global-play.playing {
            background-color: #ff453a;
            box-shadow: 0 0 15px rgba(255, 69, 58, 0.4);
        }

        /* 選擇素材的彈出視窗 (Modal) */
        .modal {
            display: none; 
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            justify-content: center;
            align-items: center;
            z-width: 1000;
        }
        .modal.show {
            display: flex;
        }
        .modal-content {
            background: #1c1c1e;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            padding: 20px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }
        .modal-header h3 { margin: 0; }
        .close-btn {
            background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer;
        }
        
        /* 彈出視窗內的選項清單 */
        .option-item {
            background: #2c2c2e;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .option-controls {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .preview-btn {
            background: #0a84ff;
            color: white; border: none; width: 40px; height: 40px; border-radius: 50%;
            font-size: 1.2rem; cursor: pointer;
        }
        .select-btn {
            background: white; color: black; border: none; padding: 8px 15px;
            border-radius: 20px; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html">← 回到主頁</a>
        <h2>你的拼貼工作站</h2>
        <p style="color:#888; font-size:0.9rem;">點擊下方區塊選擇素材，全部選滿即可播放</p>
    </div>

    <!-- 素材槽區塊 -->
    <div class="slot-container">
        <div class="slot" id="slot-drums" onclick="openModal('drums')">
            <div class="slot-info">
                <h3>🥁 鼓組 (Drums)</h3>
                <p id="label-drums">尚未選擇...</p>
            </div>
            <div class="slot-icon">➕</div>
        </div>
        
        <div class="slot" id="slot-bass" onclick="openModal('bass')">
            <div class="slot-info">
                <h3>🎸 低音 (Sub Bass)</h3>
                <p id="label-bass">尚未選擇...</p>
            </div>
            <div class="slot-icon">➕</div>
        </div>

        <div class="slot" id="slot-chords" onclick="openModal('chords')">
            <div class="slot-info">
                <h3>🎹 和弦 (Chords)</h3>
                <p id="label-chords">尚未選擇...</p>
            </div>
            <div class="slot-icon">➕</div>
        </div>
    </div>

    <!-- 底部共同播放按鈕 -->
    <div class="global-play-container">
        <button id="globalPlayBtn" class="btn-global-play">需填滿所有軌道</button>
    </div>

    <!-- 選擇素材的彈出視窗 -->
    <div id="selectionModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">選擇素材</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            <div id="modalList">
                <!-- 選項會透過 JavaScript 動態生成在這裡 -->
            </div>
        </div>
    </div>

    <script>
        // 素材資料庫：每個分類提供至少兩種選擇，讓使用者有拼貼組合的樂趣
        // 🚨 這裡需要對應你輸出的檔案名稱
        const library = {
            drums: [
                { id: 'd1', name: '動力重拍 (Power Beat)', url: 'audio/drums1.mp3' },
                { id: 'd2', name: '輕快碎拍 (Breakbeat)', url: 'audio/drums2.mp3' }
            ],
            bass: [
                { id: 'b1', name: '深沉低頻 (Deep Sub)', url: 'audio/bass1.mp3' },
                { id: 'b2', name: '顆粒合成器 (Gritty Synth)', url: 'audio/bass2.mp3' }
            ],
            chords: [
                { id: 'c1', name: '迷幻和弦 (Ambient Pad)', url: 'audio/chords1.mp3' },
                { id: 'c2', name: '明亮跳躍 (Stab Chords)', url: 'audio/chords2.mp3' }
            ]
        };

        let currentSelection = { drums: null, bass: null, chords: null };
        let activeCategory = ''; 
        let previewAudio = new Audio(); // 用於在 Modal 內單獨預覽的普通播放器
        let tonePlayers = {}; // 用於存放 Tone.js 的播放器實例

        const modal = document.getElementById('selectionModal');
        const modalList = document.getElementById('modalList');
        const modalTitle = document.getElementById('modalTitle');
        const globalPlayBtn = document.getElementById('globalPlayBtn');

        // 開啟選擇視窗
        function openModal(category) {
            activeCategory = category;
            const categoryNames = { drums: '鼓組 (Drums)', bass: '低音 (Bass)', chords: '和弦 (Chords)' };
            modalTitle.innerText = `選擇 ${categoryNames[category]}`;
            
            modalList.innerHTML = '';
            // 讀取 library 中對應的選項並生成 HTML
            library[category].forEach(item => {
                const isSelected = currentSelection[category] && currentSelection[category].id === item.id;
                
                const div = document.createElement('div');
                div.className = 'option-item';
                div.innerHTML = `
                    <div style="flex:1;">
                        <div style="font-weight:bold; margin-bottom:5px;">${item.name}</div>
                        ${isSelected ? '<span style="font-size:0.8rem; color:#30d158;">✅ 目前選擇</span>' : ''}
                    </div>
                    <div class="option-controls">
                        <button class="preview-btn" onclick="togglePreview('${item.url}', this)">▶</button>
                        <button class="select-btn" onclick="selectItem('${item.id}', '${item.name}', '${item.url}')">選擇</button>
                    </div>
                `;
                modalList.appendChild(div);
            });
            modal.classList.add('show');
        }

        function closeModal() {
            modal.classList.remove('show');
            previewAudio.pause(); // 關閉視窗時停止預覽音樂
        }

        // 單獨預覽功能 (不進入 Tone.js 同步引擎)
        function togglePreview(url, btn) {
            if (previewAudio.src && previewAudio.src.includes(url) && !previewAudio.paused) {
                previewAudio.pause();
                btn.innerText = '▶';
            } else {
                previewAudio.src = url;
                previewAudio.play();
                // 把所有預覽按鈕重置為 ▶，當下點擊的變成 ⏸
                document.querySelectorAll('.preview-btn').forEach(b => b.innerText = '▶');
                btn.innerText = '⏸';
            }
        }

        // 確認選擇並更新主畫面
        function selectItem(id, name, url) {
            currentSelection[activeCategory] = { id, name, url };
            
            // 更新介面文字與樣式
            document.getElementById(`label-${activeCategory}`).innerText = name;
            document.getElementById(`slot-${activeCategory}`).classList.add('active');
            
            closeModal();
            checkReadyStatus();
        }

        // 檢查是否三個軌道都選了
        function checkReadyStatus() {
            const isReady = currentSelection.drums && currentSelection.bass && currentSelection.chords;
            if (isReady) {
                globalPlayBtn.classList.add('ready');
                globalPlayBtn.innerText = '▶ 共同播放';
            }
        }

        // 🚀 Tone.js 核心同步播放邏輯
        let isPlaying = false;

        globalPlayBtn.addEventListener('click', async () => {
            if (!currentSelection.drums || !currentSelection.bass || !currentSelection.chords) return;

            if (isPlaying) {
                // 停止播放
                Tone.Transport.stop();
                globalPlayBtn.classList.remove('playing');
                globalPlayBtn.innerText = '▶ 共同播放';
                isPlaying = false;
                return;
            }

            // 準備播放：按鈕顯示載入中
            globalPlayBtn.innerText = '載入對軌中...';
            
            // 確保瀏覽器允許播放音訊 (Web Audio API 安全機制)
            await Tone.start();
            Tone.Transport.stop(); // 確保時間軸歸零

            // 清理舊的播放器 (如果使用者換了素材)
            Object.values(tonePlayers).forEach(player => player.dispose());
            tonePlayers = {};

            // 建立新的 Tone.Player 並掛載到 Transport 全域時間軸
            tonePlayers.drums = new Tone.Player(currentSelection.drums.url).toDestination().sync().start(0);
            tonePlayers.bass = new Tone.Player(currentSelection.bass.url).toDestination().sync().start(0);
            tonePlayers.chords = new Tone.Player(currentSelection.chords.url).toDestination().sync().start(0);

            // 設定這些軌道都要無限循環
            tonePlayers.drums.loop = true;
            tonePlayers.bass.loop = true;
            tonePlayers.chords.loop = true;

            // 等待所有音檔完全載入緩衝區 (避免不同步)
            await Tone.loaded();

            // 啟動全域時間軸，所有掛載的音樂會在同一毫秒一起發聲
            Tone.Transport.start();
            
            // 更新按鈕狀態
            globalPlayBtn.classList.add('playing');
            globalPlayBtn.innerText = '⏸ 停止播放';
            isPlaying = true;
        });
    </script>
</body>
</html>
