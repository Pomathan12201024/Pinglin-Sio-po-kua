<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聲音採集與拼貼｜一心二葉・坪心而唱</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        :root {
            --forest: #385C45;
            --tea: #789477;
            --cream: #F5F4EC;
            --paper: #E9E8D8;
            --earth: #B9A47C;
            --text: #333D34;
            --muted: #858B82;
            --white: #FFFFFF;
            --shadow: 0 5px 18px rgba(56, 92, 69, 0.09);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--cream);
            color: var(--text);
            touch-action: none;
        }

        button {
            font: inherit;
        }

        /* 整體版面 */

        .app {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            padding: 10px 16px;
            display: grid;
            grid-template-rows:
                auto
                minmax(0, 1.05fr)
                minmax(0, 0.95fr)
                minmax(0, 0.75fr);
            gap: 9px;
            overflow: hidden;
        }

        /* 頁首 */

        .header {
            min-height: 35px;
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            align-items: center;
            gap: 4px;
        }

        .header a {
            color: var(--forest);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            justify-self: start;
        }

        .header h1 {
            margin: 0;
            color: var(--forest);
            font-size: 1.05rem;
            letter-spacing: 1px;
            text-align: center;
            white-space: nowrap;
            justify-self: center;
        }

        .help-btn {
            width: 30px;
            height: 30px;
            justify-self: center;
            border: 1.5px solid var(--tea);
            border-radius: 50%;
            background: var(--white);
            color: var(--forest);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* 主畫面 */

        .main-panel {
            min-height: 0;
            background: var(--white);
            border-radius: 18px;
            padding: 10px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            overflow: hidden;
        }

        .main-image-wrap {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border-radius: 13px;
            background: var(--paper);
        }

        .main-image {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: cover;
        }

        .main-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
            font-size: 0.85rem;
        }

        .placeholder-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            opacity: 0.65;
        }

        .main-info {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .main-info h2 {
            margin: 0 0 5px;
            color: var(--forest);
            font-size: clamp(1rem, 3.8vw, 1.35rem);
        }

        .main-info p {
            margin: 0;
            color: var(--muted);
            font-size: clamp(0.72rem, 2.8vw, 0.88rem);
            line-height: 1.45;
            overflow: hidden;
        }

        .version-label {
            display: inline-block;
            align-self: flex-start;
            margin-top: 7px;
            padding: 3px 9px;
            border-radius: 20px;
            background: var(--paper);
            color: var(--forest);
            font-size: 0.7rem;
        }

        .main-play {
            margin-top: 9px;
            width: 100%;
            min-height: 34px;
            border: none;
            border-radius: 20px;
            background: var(--forest);
            color: white;
            font-weight: bold;
            font-size: 0.82rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .main-play.playing {
            background: var(--earth);
        }

        .main-play:disabled {
            background: #c5c8bd;
            cursor: not-allowed;
        }

        /* 素材格子 */

        .materials-panel {
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 8px;
            overflow: hidden;
        }

        .material-card {
            position: relative;
            min-width: 0;
            min-height: 0;
            border: 2px solid transparent;
            border-radius: 13px;
            background: var(--white);
            box-shadow: var(--shadow);
            overflow: hidden;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            perspective: 600px;
        }

        .material-card.selected {
            border-color: var(--tea);
            opacity: 1;
        }

        .material-card.dragging {
            opacity: 0.75;
            z-index: 50;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.35s ease;
        }

        .material-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .card-face img {
            width: 100%;
            height: 68%;
            min-height: 0;
            object-fit: cover;
            pointer-events: none;
        }

        .card-name {
            flex: 1;
            min-height: 0;
            padding: 3px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--forest);
            font-size: clamp(0.65rem, 2.5vw, 0.82rem);
            font-weight: bold;
            text-align: center;
            line-height: 1.15;
        }

        .card-play {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 27px;
            height: 27px;
            border: none;
            border-radius: 50%;
            background: rgba(56, 92, 69, 0.92);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            z-index: 5;
            pointer-events: none;
        }

        .material-card.is-playing .card-play {
            display: flex;
            background: var(--earth);
        }

        .flip-mark {
            position: absolute;
            left: 5px;
            top: 5px;
            padding: 3px 6px;
            border-radius: 10px;
            background: rgba(255,255,255,0.88);
            color: var(--forest);
            font-size: 0.6rem;
            pointer-events: none;
        }

        /* 拼貼區 */

        .collage-panel {
            min-height: 0;
            padding: 8px 10px;
            border-radius: 16px;
            background: var(--paper);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .collage-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .collage-heading h2 {
            margin: 0;
            color: var(--forest);
            font-size: 0.9rem;
        }

        .collage-heading span {
            color: var(--muted);
            font-size: 0.68rem;
        }

        /*
           拼貼素材區：
           改用格狀排列，素材多時只在此區域捲動。
        */

        .drop-area {
            min-height: 0;
            flex: 1;

            border: 2px dashed rgba(56, 92, 69, 0.35);
            border-radius: 11px;
            padding: 6px;

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
            grid-auto-rows: 96px;
            align-content: start;
            gap: 7px;

            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;
            scrollbar-width: thin;
            scrollbar-color: var(--tea) transparent;
        }

        .drop-area.drag-over {
            background: rgba(120, 148, 119, 0.2);
            border-color: var(--forest);
        }

        .drop-hint {
            grid-column: 1 / -1;
            width: 100%;
            height: 100%;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-align: center;
            font-size: 0.75rem;
        }

        /* 拼貼區中的單一素材卡片 */

        .collage-item {
            position: relative;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: var(--white);
            box-shadow: 0 2px 6px rgba(56, 92, 69, 0.1);
        }

        .collage-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 素材名稱與版本 */

        .collage-item-info {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 15px 4px 5px;
            background: linear-gradient(
                transparent,
                rgba(255,255,255,0.96) 40%
            );
            color: var(--forest);
            text-align: center;
            pointer-events: none;
        }

        .collage-item-title {
            display: block;
            font-size: 0.66rem;
            font-weight: bold;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }

        .collage-item-version {
            display: block;
            margin-top: 2px;
            font-size: 0.58rem;
            line-height: 1.15;
            color: var(--muted);
        }

        /* 移除按鈕 */

        .remove-item {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: rgba(56, 92, 69, 0.92);
            color: white;
            font-size: 0.85rem;
            line-height: 1;
            z-index: 3;
            cursor: pointer;
        }

        .collage-actions {
            display: flex;
            gap: 7px;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .collage-actions button {
            min-height: 31px;
            border: none;
            border-radius: 18px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
        }

        .clear-btn {
            padding: 0 13px;
            background: var(--white);
            color: var(--forest);
        }

        .confirm-btn {
            flex: 1;
            background: var(--forest);
            color: white;
        }

        .confirm-btn:disabled {
            background: #c5c8bd;
            cursor: not-allowed;
        }

        .confirm-btn.playing {
            background: var(--earth);
        }

        /* 拖曳提示 */

        .drag-ghost {
            position: fixed;
            z-index: 9999;
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            pointer-events: none;
            opacity: 0.85;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            transform: translate(-50%, -50%);
        }

        /* 逐步操作導覽 */

        .tour-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            pointer-events: none;
            display: none;
        }

        .tour-overlay.active {
            display: block;
        }

        .tour-shade {
            position: absolute;
            background: rgba(0, 0, 0, 0.62);
            pointer-events: auto;
        }

        .tour-bubble {
            position: absolute;
            z-index: 10002;
            width: min(270px, calc(100vw - 36px));
            padding: 13px 14px;
            border-radius: 15px;
            background: white;
            color: var(--text);
            box-shadow: 0 8px 28px rgba(0,0,0,0.25);
            pointer-events: auto;
        }

        .tour-bubble::before {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            transform: rotate(45deg);
        }

        .tour-bubble.arrow-top::before {
            top: -6px;
            left: 25px;
        }

        .tour-bubble.arrow-bottom::before {
            bottom: -6px;
            left: 25px;
        }

        .tour-bubble.arrow-left::before {
            left: -6px;
            top: 22px;
        }

        .tour-bubble.arrow-right::before {
            right: -6px;
            top: 22px;
        }

        .tour-step-count {
            color: var(--tea);
            font-size: 0.68rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .tour-bubble h3 {
            margin: 0 0 5px;
            color: var(--forest);
            font-size: 0.95rem;
        }

        .tour-bubble p {
            margin: 0;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .tour-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 12px;
        }

        .tour-controls button {
            border: none;
            border-radius: 18px;
            padding: 7px 13px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .tour-prev {
            background: var(--paper);
            color: var(--forest);
        }

        .tour-next {
            margin-left: auto;
            background: var(--forest);
            color: white;
        }

        .tour-skip {
            background: var(--paper);
            color: var(--forest);
        }

        .tour-prev:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* 直向手機 */

        @media (orientation: portrait) {
            .app {
                grid-template-rows:
                    auto
                    minmax(0, 1.05fr)
                    minmax(0, 0.95fr)
                    minmax(0, 0.72fr);
            }
        }

        /* 橫向手機 */

        @media (orientation: landscape) {
            .app {
                padding: 7px 12px;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows:
                    auto
                    minmax(0, 1fr)
                    minmax(0, 0.9fr);
                gap: 7px 10px;
            }

            .header {
                grid-column: 1 / -1;
                min-height: 28px;
            }

            .main-panel {
                grid-column: 1;
                grid-row: 2;

                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr);

                gap: 8px;
                padding: 8px;
            }

            .main-image-wrap {
                min-height: 0;
                min-width: 0;
            }

            .main-info {
                min-width: 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: stretch;
                overflow: hidden;
            }

            .main-info h2 {
                font-size: clamp(0.85rem, 2.2vw, 1.1rem);
                margin: 0 0 5px;
            }

            .main-info p {
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 4;
                overflow: hidden;
                font-size: clamp(0.68rem, 1.7vw, 0.82rem);
                line-height: 1.45;
            }

            .version-label {
                display: inline-block;
                align-self: flex-start;
                margin-top: 5px;
                font-size: 0.65rem;
            }

            .version-label[hidden] {
                display: none;
            }

            .main-play {
                width: 100%;
                min-height: 30px;
                margin-top: 7px;
                font-size: 0.75rem;
            }

            .materials-panel {
                grid-column: 2;
                grid-row: 2;
                grid-template-columns: repeat(3, minmax(0, 1fr));
                grid-template-rows: repeat(2, minmax(0, 1fr));
                gap: 7px;
            }

            .card-face img {
                height: 68%;
            }

            .card-name {
                font-size: clamp(0.62rem, 1.8vw, 0.78rem);
            }

            .collage-panel {
                grid-column: 1 / -1;
                grid-row: 3;
                padding: 7px 10px;
            }

            .collage-heading {
                margin-bottom: 5px;
            }

            .drop-area {
                grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
                grid-auto-rows: 88px;
                min-height: 0;
                flex: 1;
                padding: 5px;
                gap: 6px;
            }

            .collage-actions {
                margin-top: 5px;
            }

            .collage-actions button {
                min-height: 32px;
            }
        }

        /* 較矮的橫向手機 */

        @media (max-height: 420px) and (orientation: landscape) {
            .app {
                padding: 4px 9px;
                grid-template-rows:
                    auto
                    minmax(0, 1fr)
                    minmax(0, 0.9fr);
                gap: 5px 8px;
            }

            .header {
                min-height: 23px;
            }

            .header h1 {
                font-size: 0.9rem;
            }

            .main-panel {
                padding: 6px;
                gap: 6px;
            }

            .main-info h2 {
                font-size: 0.85rem;
            }

            .main-info p {
                -webkit-line-clamp: 3;
                font-size: 0.65rem;
                line-height: 1.35;
            }

            .version-label {
                margin-top: 3px;
                padding: 2px 7px;
                font-size: 0.6rem;
            }

            .main-play {
                min-height: 27px;
                margin-top: 5px;
                font-size: 0.7rem;
            }

            .materials-panel {
                gap: 5px;
            }

            .collage-panel {
                padding: 5px 8px;
            }

            .collage-heading {
                margin-bottom: 3px;
            }

            .drop-area {
                grid-auto-rows: 76px;
                padding: 4px;
                gap: 5px;
            }

            .collage-item-title {
                font-size: 0.6rem;
            }

            .collage-item-version {
                font-size: 0.54rem;
            }

            .collage-actions {
                margin-top: 3px;
            }

            .collage-actions button {
                min-height: 29px;
            }
        }

        @media (max-width: 350px) and (orientation: portrait) {
            .app {
                padding-left: 10px;
                padding-right: 10px;
            }

            .materials-panel {
                gap: 5px;
            }

            .card-name {
                font-size: 0.62rem;
            }

            .header a {
                font-size: 0.78rem;
            }

            .header h1 {
                font-size: 0.9rem;
            }

            .drop-area {
                grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
                grid-auto-rows: 90px;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- 頁首 -->
    <header class="header" id="header">
        <a href="index.html">← 回到主頁</a>
        <h1>一心二葉・坪心而唱</h1>
        <button class="help-btn" id="helpBtn" aria-label="操作說明">?</button>
    </header>

    <!-- 主畫面 -->
    <section class="main-panel" id="mainPanel">

        <div class="main-image-wrap">
            <img
                id="mainImage"
                class="main-image"
                alt="聲音素材圖片"
            >

            <div class="main-placeholder" id="mainPlaceholder">
                <div class="placeholder-icon">♧</div>
                <div>請點選下方素材</div>
                <div>查看圖片與聲音介紹</div>
            </div>
        </div>

        <div class="main-info">
            <h2 id="mainTitle">尚未選擇素材</h2>

            <p id="mainDescription">
                選擇下方任一素材，即可在這裡查看相關介紹。
            </p>

            <span class="version-label" id="versionLabel" hidden>
                原始聲音
            </span>

            <button class="main-play" id="mainPlayBtn" disabled>
                ▶ 播放素材
            </button>
        </div>

    </section>

    <!-- 素材縮圖 -->
    <section class="materials-panel" id="materialsPanel"></section>

    <!-- 拼貼區 -->
    <section class="collage-panel" id="collagePanel">

        <div class="collage-heading">
            <h2>聲音拼貼</h2>
            <span id="collageCount">已放入 0 個素材</span>
        </div>

        <div class="drop-area" id="dropArea">
            <div class="drop-hint" id="dropHint">
                長按素材並拖曳至此
            </div>
        </div>

        <div class="collage-actions">
            <button class="clear-btn" id="clearBtn">
                清空
            </button>

            <button class="confirm-btn" id="confirmBtn" disabled>
                ▶ 確認拼貼
            </button>
        </div>

    </section>

</div>


<!-- 逐步操作導覽 -->
<div class="tour-overlay" id="tourOverlay">

    <div class="tour-shade" id="shadeTop"></div>
    <div class="tour-shade" id="shadeLeft"></div>
    <div class="tour-shade" id="shadeRight"></div>
    <div class="tour-shade" id="shadeBottom"></div>

    <div class="tour-bubble" id="tourBubble">

        <div class="tour-step-count" id="tourStepCount">
            STEP 1 / 5
        </div>

        <h3 id="tourTitle"></h3>

        <p id="tourDescription"></p>

        <div class="tour-controls">
            <button class="tour-prev" id="tourPrev">上一步</button>
            <button class="tour-skip" id="tourSkip" hidden>略過</button>
            <button class="tour-next" id="tourNext">下一步 →</button>
        </div>

    </div>

</div>


<script>
    /* =================================================
       素材資料設定
    ================================================= */

    const materials = [
        {
            id: "single_1",
            title: "走路聲",
            image: "images/photo_2_1.jpg",
            description: "坪林田野採集的走路聲音素材。",
            original: "audio/single_1.mp3",
            processed: "audio/processed_single_1.mp3",
            collageOriginal: "audio/collage_1_original.mp3",
            collageProcessed: "audio/collage_1_processed.mp3"
        },
        {
            id: "single_2",
            title: "蟲鳴鳥叫聲",
            image: "images/photo_2_2.jpg",
            description: "坪林山林中的蟲鳴與鳥叫聲。",
            original: "audio/single_2.mp3",
            processed: "audio/processed_single_2.mp3",
            collageOriginal: "audio/collage_2_original.mp3",
            collageProcessed: "audio/collage_2_processed.mp3"
        },
        {
            id: "single_3",
            title: "河流聲",
            image: "images/photo_2_3.jpg",
            description: "採集自坪林河流的流水聲。",
            original: "audio/single_3.mp3",
            processed: "audio/processed_single_3.mp3",
            collageOriginal: "audio/collage_3_original.mp3",
            collageProcessed: "audio/collage_3_processed.mp3"
        },
        {
            id: "single_4",
            title: "採茶聲",
            image: "images/photo_2_4.jpg",
            description: "採集採摘茶葉時所產生的聲音。",
            original: "audio/single_4.mp3",
            processed: "audio/processed_single_4.mp3",
            collageOriginal: "audio/collage_4_original.mp3",
            collageProcessed: "audio/collage_4_processed.mp3"
        },
        {
            id: "single_5",
            title: "竹簍掃動茶葉聲",
            image: "images/photo_2_5.jpg",
            description: "竹簍掃動茶葉時所產生的聲音。",
            original: "audio/single_5.mp3",
            processed: "audio/processed_single_5.mp3",
            collageOriginal: "audio/collage_5_original.mp3",
            collageProcessed: "audio/collage_5_processed.mp3"
        }
    ];


    /* =================================================
       狀態
    ================================================= */

    let currentMaterial = null;
    let currentVersion = null;

    let previewAudio = new Audio();
    previewAudio.loop = true;

    let collageItems = [];
    let tonePlayers = [];
    let collagePlaying = false;

    const materialsPanel = document.getElementById("materialsPanel");
    const dropArea = document.getElementById("dropArea");

    const mainImage = document.getElementById("mainImage");
    const mainPlaceholder = document.getElementById("mainPlaceholder");
    const mainTitle = document.getElementById("mainTitle");
    const mainDescription = document.getElementById("mainDescription");
    const versionLabel = document.getElementById("versionLabel");
    const mainPlayBtn = document.getElementById("mainPlayBtn");

    const confirmBtn = document.getElementById("confirmBtn");
    const clearBtn = document.getElementById("clearBtn");


    /* =================================================
       逐步操作導覽
    ================================================= */

    const tourOverlay = document.getElementById("tourOverlay");
    const tourBubble = document.getElementById("tourBubble");

    const tourSteps = [
        {
            target: "materialsPanel",
            title: "① 選擇聲音素材",
            description: "點擊素材，可以查看圖片與介紹，並播放或暫停聲音。",
            placement: "top"
        },
        {
            target: "mainPanel",
            title: "② 聆聽與認識素材",
            description: "這裡會顯示所選素材的圖片、介紹，以及播放控制。",
            placement: "bottom"
        },
        {
            target: "materialsPanel",
            title: "③ 切換聲音版本",
            description: "在素材格子上左右滑動，即可切換原始聲音與加工版本。",
            placement: "top"
        },
        {
            target: "collagePanel",
            title: "④ 加入聲音拼貼",
            description: "長按素材並拖曳至下方拼貼區，加入當下選取的聲音版本。同一素材的原始版與加工版可以同時加入。",
            placement: "top"
        },
        {
            target: "collagePanel",
            title: "⑤ 完成你的聲音風景",
            description: "加入素材後，按下「確認拼貼」播放組合聲音。素材會自動依照原始版、加工版的順序排列，也可以在拼貼區內捲動查看。",
            placement: "top"
        }
    ];

    let currentTourStep = 0;

    const shadeTop = document.getElementById("shadeTop");
    const shadeLeft = document.getElementById("shadeLeft");
    const shadeRight = document.getElementById("shadeRight");
    const shadeBottom = document.getElementById("shadeBottom");

    const tourStepCount = document.getElementById("tourStepCount");
    const tourTitle = document.getElementById("tourTitle");
    const tourDescription = document.getElementById("tourDescription");

    const tourPrev = document.getElementById("tourPrev");
    const tourNext = document.getElementById("tourNext");


    function openTour(showSkip = false) {
        currentTourStep = 0;

        document.getElementById("tourSkip").hidden = !showSkip;

        tourOverlay.classList.add("active");

        requestAnimationFrame(showTourStep);
    }

    function closeTour() {
        tourOverlay.classList.remove("active");
    }

    function showTourStep() {
        const step = tourSteps[currentTourStep];
        const target = document.getElementById(step.target);

        if (!target) return;

        const rect = target.getBoundingClientRect();

        const width = window.innerWidth;
        const height = window.innerHeight;

        const left = Math.max(0, rect.left - 5);
        const top = Math.max(0, rect.top - 5);
        const right = Math.min(width, rect.right + 5);
        const bottom = Math.min(height, rect.bottom + 5);

        /* 四個遮罩區塊，留下目標區域 */

        shadeTop.style.left = "0";
        shadeTop.style.top = "0";
        shadeTop.style.width = width + "px";
        shadeTop.style.height = top + "px";

        shadeLeft.style.left = "0";
        shadeLeft.style.top = top + "px";
        shadeLeft.style.width = left + "px";
        shadeLeft.style.height = (bottom - top) + "px";

        shadeRight.style.left = right + "px";
        shadeRight.style.top = top + "px";
        shadeRight.style.width = (width - right) + "px";
        shadeRight.style.height = (bottom - top) + "px";

        shadeBottom.style.left = "0";
        shadeBottom.style.top = bottom + "px";
        shadeBottom.style.width = width + "px";
        shadeBottom.style.height = (height - bottom) + "px";

        tourStepCount.textContent =
            `STEP ${currentTourStep + 1} / ${tourSteps.length}`;

        tourTitle.textContent = step.title;
        tourDescription.textContent = step.description;

        tourPrev.disabled = currentTourStep === 0;

        if (currentTourStep === tourSteps.length - 1) {
            tourNext.textContent = "完成 ✓";
        } else {
            tourNext.textContent = "下一步 →";
        }

        /* 提示框位置 */

        tourBubble.className = "tour-bubble";

        const bubbleWidth = Math.min(270, width - 36);
        const bubbleHeight = tourBubble.offsetHeight || 145;

        let bubbleLeft = 18;
        let bubbleTop;

        if (step.placement === "top") {
            bubbleTop = top - bubbleHeight - 13;

            if (bubbleTop < 10) {
                bubbleTop = bottom + 13;
                tourBubble.classList.add("arrow-top");
            } else {
                tourBubble.classList.add("arrow-bottom");
            }

            bubbleLeft = Math.max(
                18,
                Math.min(left + 10, width - bubbleWidth - 18)
            );

        } else {
            bubbleTop = bottom + 13;

            if (bubbleTop + bubbleHeight > height - 10) {
                bubbleTop = top - bubbleHeight - 13;
                tourBubble.classList.add("arrow-bottom");
            } else {
                tourBubble.classList.add("arrow-top");
            }

            bubbleLeft = Math.max(
                18,
                Math.min(left + 10, width - bubbleWidth - 18)
            );
        }

        bubbleTop = Math.max(
            10,
            Math.min(bubbleTop, height - bubbleHeight - 10)
        );

        tourBubble.style.left = bubbleLeft + "px";
        tourBubble.style.top = bubbleTop + "px";
    }

    tourPrev.addEventListener("click", () => {
        if (currentTourStep > 0) {
            currentTourStep--;
            showTourStep();
        }
    });

    tourNext.addEventListener("click", () => {
        if (currentTourStep < tourSteps.length - 1) {
            currentTourStep++;
            showTourStep();
        } else {
            closeTour();
        }
    });

    document.getElementById("helpBtn").addEventListener("click", () => {
        openTour(true);
    });

    document.getElementById("tourSkip").addEventListener("click", closeTour);

    window.addEventListener("resize", () => {
        if (tourOverlay.classList.contains("active")) {
            showTourStep();
        }
    });


    /* =================================================
       建立素材格子
    ================================================= */

    function renderMaterials() {
        materialsPanel.innerHTML = "";

        materials.forEach(item => {
            const card = document.createElement("div");
            card.className = "material-card";
            card.dataset.id = item.id;
            card.dataset.version = "original";

            card.innerHTML = `
                <div class="card-inner">

                    <div class="card-face card-front">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="card-name">${item.title}</div>
                    </div>

                    <div class="card-face card-back">
                        <img src="${item.image}" alt="${item.title}">
                        <div class="card-name">${item.title}・加工版</div>
                    </div>

                </div>

                <span class="flip-mark">原始</span>
                <span class="card-play">Ⅱ</span>
            `;

            materialsPanel.appendChild(card);
            attachCardEvents(card, item);
        });
    }


    /* =================================================
       主畫面更新
    ================================================= */

    function updateMainDisplay(item, version) {
        currentMaterial = item;
        currentVersion = version;

        mainImage.src = item.image;
        mainImage.alt = item.title;
        mainImage.style.display = "block";

        mainPlaceholder.style.display = "none";

        mainTitle.textContent = item.title;
        mainDescription.textContent = item.description;

        versionLabel.hidden = false;
        versionLabel.textContent =
            version === "original" ? "原始聲音" : "加工後的聲音";

        mainPlayBtn.disabled = false;

        updatePreviewButton();
    }


    /* =================================================
       單獨素材播放
    ================================================= */

    function getPreviewUrl(item, version) {
        return version === "original"
            ? item.original
            : item.processed;
    }

    function updatePreviewButton() {
        const isThisPlaying =
            currentMaterial &&
            !previewAudio.paused &&
            previewAudio.dataset.material === currentMaterial.id &&
            previewAudio.dataset.version === currentVersion;

        if (!currentMaterial) {
            mainPlayBtn.textContent = "▶ 播放素材";
            mainPlayBtn.classList.remove("playing");
            mainPlayBtn.disabled = true;
        } else {
            mainPlayBtn.textContent =
                isThisPlaying ? "Ⅱ 暫停素材" : "▶ 播放素材";

            mainPlayBtn.classList.toggle("playing", isThisPlaying);
            mainPlayBtn.disabled = false;
        }

        document.querySelectorAll(".material-card").forEach(card => {
            const isPlaying =
                !previewAudio.paused &&
                previewAudio.dataset.material === card.dataset.id &&
                previewAudio.dataset.version === card.dataset.version;

            card.classList.toggle("is-playing", isPlaying);

            const playIcon = card.querySelector(".card-play");
            playIcon.textContent = isPlaying ? "Ⅱ" : "▶";
        });
    }

    async function togglePreview(item, version) {
        const sameAudio =
            previewAudio.dataset.material === item.id &&
            previewAudio.dataset.version === version;

        if (sameAudio && !previewAudio.paused) {
            previewAudio.pause();
            updatePreviewButton();
            return;
        }

        previewAudio.pause();
        previewAudio.currentTime = 0;

        const url = getPreviewUrl(item, version);

        previewAudio.src = url;
        previewAudio.dataset.material = item.id;
        previewAudio.dataset.version = version;

        try {
            await previewAudio.play();
        } catch (error) {
            console.error("素材播放失敗：", error);
            alert("目前無法播放這個音檔，請確認音檔路徑是否正確。");
        }

        updatePreviewButton();
    }

    mainPlayBtn.addEventListener("click", () => {
        if (!currentMaterial) return;
        togglePreview(currentMaterial, currentVersion);
    });

    previewAudio.addEventListener("play", updatePreviewButton);
    previewAudio.addEventListener("pause", updatePreviewButton);
    previewAudio.addEventListener("ended", updatePreviewButton);


    /* =================================================
       素材操作判定

       點擊：顯示介紹並播放／暫停
       水平滑動：翻轉原始／加工版
       長按後移動：拖曳至拼貼區
    ================================================= */

    const LONG_PRESS_TIME = 380;
    const SWIPE_DISTANCE = 35;
    const MOVE_CANCEL_DISTANCE = 12;

    function attachCardEvents(card, item) {
        let pointerStartX = 0;
        let pointerStartY = 0;
        let pointerStartTime = 0;

        let longPressTimer = null;
        let longPressed = false;
        let swiped = false;
        let dragging = false;

        let ghost = null;
        let moved = false;

        card.addEventListener("contextmenu", event => {
            event.preventDefault();
        });

        card.addEventListener("pointerdown", event => {
            if (event.pointerType === "mouse" && event.button !== 0) {
                return;
            }

            event.preventDefault();

            pointerStartX = event.clientX;
            pointerStartY = event.clientY;
            pointerStartTime = Date.now();

            longPressed = false;
            swiped = false;
            dragging = false;
            moved = false;

            card.setPointerCapture(event.pointerId);

            longPressTimer = setTimeout(() => {
                longPressed = true;
            }, LONG_PRESS_TIME);
        });

        card.addEventListener("pointermove", event => {
            const dx = event.clientX - pointerStartX;
            const dy = event.clientY - pointerStartY;

            if (
                Math.abs(dx) > MOVE_CANCEL_DISTANCE ||
                Math.abs(dy) > MOVE_CANCEL_DISTANCE
            ) {
                moved = true;
            }

            /* 長按後才允許拖曳 */

            if (longPressed && moved) {
                if (!dragging) {
                    dragging = true;
                    card.classList.add("dragging");

                    ghost = document.createElement("img");
                    ghost.src = item.image;
                    ghost.className = "drag-ghost";
                    document.body.appendChild(ghost);
                }

                if (ghost) {
                    ghost.style.left = event.clientX + "px";
                    ghost.style.top = event.clientY + "px";
                }

                const rect = dropArea.getBoundingClientRect();

                const overDropArea =
                    event.clientX >= rect.left &&
                    event.clientX <= rect.right &&
                    event.clientY >= rect.top &&
                    event.clientY <= rect.bottom;

                dropArea.classList.toggle("drag-over", overDropArea);
                return;
            }

            /* 未達長按時間的水平滑動：翻轉 */

            if (
                !longPressed &&
                !swiped &&
                Math.abs(dx) > SWIPE_DISTANCE &&
                Math.abs(dx) > Math.abs(dy) * 1.2
            ) {
                swiped = true;
                clearTimeout(longPressTimer);
                flipCard(card);
            }
        });

        card.addEventListener("pointerup", event => {
            clearTimeout(longPressTimer);

            if (dragging) {
                const rect = dropArea.getBoundingClientRect();

                const overDropArea =
                    event.clientX >= rect.left &&
                    event.clientX <= rect.right &&
                    event.clientY >= rect.top &&
                    event.clientY <= rect.bottom;

                if (overDropArea) {
                    addToCollage(item, card.dataset.version);
                }

                card.classList.remove("dragging");
                dropArea.classList.remove("drag-over");

                if (ghost) ghost.remove();

                ghost = null;
                dragging = false;
                return;
            }

            /* 短時間點擊：顯示介紹並播放／暫停 */

            const elapsed = Date.now() - pointerStartTime;

            if (!longPressed && !swiped && !moved && elapsed < LONG_PRESS_TIME) {
                const version = card.dataset.version;

                updateMainDisplay(item, version);
                togglePreview(item, version);
            }
        });

        card.addEventListener("pointercancel", () => {
            clearTimeout(longPressTimer);

            card.classList.remove("dragging");
            dropArea.classList.remove("drag-over");

            if (ghost) ghost.remove();

            ghost = null;
            dragging = false;
        });
    }


    /* =================================================
       翻轉素材
    ================================================= */

    function flipCard(card) {
        const isFlipped = card.classList.toggle("flipped");

        const version = isFlipped ? "processed" : "original";

        card.dataset.version = version;

        const mark = card.querySelector(".flip-mark");
        mark.textContent = isFlipped ? "加工版" : "原始";

        const item = materials.find(
            material => material.id === card.dataset.id
        );

        if (item && currentMaterial && currentMaterial.id === item.id) {
            updateMainDisplay(item, version);

            previewAudio.pause();
            previewAudio.currentTime = 0;

            updatePreviewButton();
        }
    }


    /* =================================================
       拼貼素材排序

       依照 materials 陣列中的素材順序排列。
       同一素材的原始版會排在加工版之前。
    ================================================= */

    function sortCollageItems() {
        collageItems.sort((a, b) => {
            const indexA = materials.findIndex(
                material => material.id === a.id
            );

            const indexB = materials.findIndex(
                material => material.id === b.id
            );

            if (indexA !== indexB) {
                return indexA - indexB;
            }

            if (a.version === b.version) {
                return 0;
            }

            return a.version === "original" ? -1 : 1;
        });
    }


    /* =================================================
       加入拼貼區

       同一素材的不同版本可以同時加入。
       相同素材、相同版本只能加入一次。
       加入後自動依照素材順序排列。
    ================================================= */

    function addToCollage(item, version) {
        const alreadyExists = collageItems.some(
            selected =>
                selected.id === item.id &&
                selected.version === version
        );

        if (alreadyExists) {
            return;
        }

        collageItems.push({
            id: item.id,
            title: item.title,
            image: item.image,
            version: version,
            audio: version === "original"
                ? item.collageOriginal
                : item.collageProcessed
        });

        /* 自動排序 */
        sortCollageItems();

        const card = document.querySelector(
            `.material-card[data-id="${item.id}"]`
        );

        if (card) {
            card.classList.add("selected");
        }

        renderCollage();
    }


    /* =================================================
       拼貼區顯示

       使用格狀卡片。
       每張卡片顯示素材名稱與版本。
    ================================================= */

    function renderCollage() {
        dropArea.innerHTML = "";

        if (collageItems.length === 0) {
            const hint = document.createElement("div");
            hint.className = "drop-hint";
            hint.textContent = "長按素材並拖曳至此";
            dropArea.appendChild(hint);
        }

        collageItems.forEach(item => {
            const div = document.createElement("div");
            div.className = "collage-item";

            const versionText =
                item.version === "original" ? "原始聲音" : "加工版";

            div.innerHTML = `
                <img src="${item.image}" alt="${item.title}">

                <div class="collage-item-info">
                    <span class="collage-item-title">
                        ${item.title}
                    </span>

                    <span class="collage-item-version">
                        ${versionText}
                    </span>
                </div>

                <button class="remove-item" aria-label="移除">×</button>
            `;

            div.querySelector(".remove-item").addEventListener("click", () => {
                removeFromCollage(item.id, item.version);
            });

            dropArea.appendChild(div);
        });

        document.getElementById("collageCount").textContent =
            `已放入 ${collageItems.length} 個素材`;

        confirmBtn.disabled = collageItems.length === 0;
    }


    /* =================================================
       移除拼貼素材

       只移除指定素材的指定版本。
       若另一個版本仍存在，素材格子仍維持選取狀態。
    ================================================= */

    function removeFromCollage(id, version) {
        collageItems = collageItems.filter(
            item => !(item.id === id && item.version === version)
        );

        const card = document.querySelector(
            `.material-card[data-id="${id}"]`
        );

        if (card) {
            const stillSelected = collageItems.some(
                item => item.id === id
            );

            card.classList.toggle("selected", stillSelected);
        }

        renderCollage();
    }

    clearBtn.addEventListener("click", () => {
        if (collagePlaying) stopCollage();

        collageItems = [];

        document.querySelectorAll(".material-card").forEach(card => {
            card.classList.remove("selected");
        });

        renderCollage();
    });


    /* =================================================
       拼貼播放：同步播放各素材的節奏版本
    ================================================= */

    function disposeCollagePlayers() {
        tonePlayers.forEach(player => {
            player.stop();
            player.dispose();
        });

        tonePlayers = [];
    }

    async function startCollage() {
        if (collageItems.length === 0 || collagePlaying) return;

        try {
            await Tone.start();

            Tone.Transport.stop();
            Tone.Transport.cancel();

            disposeCollagePlayers();

            collageItems.forEach(item => {
                const player = new Tone.Player({
                    url: item.audio,
                    loop: true
                }).toDestination();

                player.sync().start(0);
                tonePlayers.push(player);
            });

            await Tone.loaded();

            Tone.Transport.start();

            collagePlaying = true;
            confirmBtn.textContent = "■ 停止拼貼";
            confirmBtn.classList.add("playing");

        } catch (error) {
            console.error("拼貼播放失敗：", error);
            alert("拼貼音檔尚未準備完成，請確認音檔路徑。");

            Tone.Transport.stop();
            Tone.Transport.cancel();
            disposeCollagePlayers();
        }
    }

    function stopCollage() {
        Tone.Transport.stop();
        Tone.Transport.cancel();

        disposeCollagePlayers();

        collagePlaying = false;
        confirmBtn.textContent = "▶ 確認拼貼";
        confirmBtn.classList.remove("playing");
    }

    confirmBtn.addEventListener("click", async () => {
        if (collagePlaying) {
            stopCollage();
        } else {
            await startCollage();
        }
    });


    /* =================================================
       初始化
    ================================================= */

    renderMaterials();
    renderCollage();
    updatePreviewButton();

    /* 每次進入頁面時自動開始操作導覽 */
    openTour();

</script>
