<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>聲音採集與拼貼｜一心二葉・坪心而唱</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>

    <style>
        :root {
            --forest: #385C45;
            --tea: #789477;
            --cream: #F5F4EC;
            --paper: #E9E8D8;
            --earth: #B9A47C;
            --text: #333D34;
            --muted: #858B82;
            --white: #FFFFFF;
            --shadow: 0 5px 18px rgba(56, 92, 69, 0.09);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            overscroll-behavior: none;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: var(--cream);
            color: var(--text);
            touch-action: none;
        }

        button {
            font: inherit;
        }

        /* 整體版面 */

        .app {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            padding: 10px 16px;
            display: grid;
            grid-template-rows:
                auto
                minmax(0, 1.05fr)
                minmax(0, 0.95fr)
                minmax(0, 0.75fr);
            gap: 9px;
            overflow: hidden;
        }

        /* 頁首 */

        .header {
            min-height: 35px;
            display: grid;
            grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
            align-items: center;
            gap: 6px;
        }

        .header-tools {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .lang-switch {
            display: flex;
            align-items: center;
            gap: 2px;
            padding: 3px;
            border-radius: 18px;
            background: var(--white);
            border: 1px solid rgba(120, 148, 119, 0.35);
        }

        .lang-switch button {
            min-width: 25px;
            padding: 4px 5px;
            border: 0;
            border-radius: 14px;
            background: transparent;
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: bold;
            cursor: pointer;
        }

        .lang-switch button.active {
            background: var(--forest);
            color: white;
        }

        .header a {
            color: var(--forest);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: bold;
            white-space: nowrap;
            justify-self: start;
        }

        .header h1 {
            margin: 0;
            color: var(--forest);
            font-size: 1.05rem;
            letter-spacing: 1px;
            text-align: center;
            white-space: nowrap;
            justify-self: center;
        }

        .help-btn {
            width: 30px;
            height: 30px;
            justify-self: center;
            border: 1.5px solid var(--tea);
            border-radius: 50%;
            background: var(--white);
            color: var(--forest);
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
        }

        /* 主畫面 */

        .main-panel {
            min-height: 0;
            background: var(--white);
            border-radius: 18px;
            padding: 10px;
            box-shadow: var(--shadow);
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
            overflow: hidden;
        }

        .main-image-wrap {
            position: relative;
            min-width: 0;
            min-height: 0;
            overflow: hidden;
            border-radius: 13px;
            background: var(--paper);
        }

        .main-image {
            width: 100%;
            height: 100%;
            display: none;
            object-fit: cover;
        }

        .main-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 15px;
            color: var(--muted);
            text-align: center;
            line-height: 1.7;
            font-size: 0.85rem;
        }

        .placeholder-icon {
            font-size: 2rem;
            margin-bottom: 8px;
            opacity: 0.65;
        }

        .main-info {
            min-width: 0;
            min-height: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .main-info h2 {
            margin: 0 0 5px;
            color: var(--forest);
            font-size: clamp(1rem, 3.8vw, 1.35rem);
        }

        .main-info p {
            margin: 0;
            color: var(--muted);
            font-size: clamp(0.72rem, 2.8vw, 0.88rem);
            line-height: 1.45;
            overflow: hidden;
        }

        .version-label {
            display: inline-block;
            align-self: flex-start;
            margin-top: 7px;
            padding: 3px 9px;
            border-radius: 20px;
            background: var(--paper);
            color: var(--forest);
            font-size: 0.7rem;
        }

        .main-play {
            margin-top: 9px;
            width: 100%;
            min-height: 34px;
            border: none;
            border-radius: 20px;
            background: var(--forest);
            color: white;
            font-weight: bold;
            font-size: 0.82rem;
            cursor: pointer;
            flex-shrink: 0;
        }

        .main-play.playing {
            background: var(--earth);
        }

        .main-play:disabled {
            background: #c5c8bd;
            cursor: not-allowed;
        }

        /* 素材格子 */

        .materials-panel {
            min-height: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            grid-template-rows: minmax(0, 1fr) auto;
            gap: 7px;
            overflow: hidden;
        }

        .field-materials-grid {
            min-height: 0;
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            grid-template-rows: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        .sio-section {
            min-width: 0;
            padding: 5px 7px 6px;
            border: 1.5px dashed var(--tea);
            border-radius: 11px;
            background: rgba(255,255,255,0.48);
            overflow: hidden;
        }

        .sio-section-heading {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 6px;
            margin-bottom: 4px;
            color: var(--forest);
            font-size: 0.7rem;
            font-weight: bold;
        }

        .sio-section-heading small {
            color: var(--muted);
            font-size: 0.58rem;
            font-weight: normal;
            white-space: nowrap;
        }

        .sio-song-list {
            display: grid;
            grid-template-columns: repeat(6, minmax(0, 1fr));
            gap: 4px;
        }

        .sio-card {
            min-width: 0;
            min-height: 29px;
            padding: 4px 2px;
            border: 1px solid rgba(120,148,119,0.5);
            border-radius: 7px;
            background: var(--white);
            color: var(--forest);
            font-size: clamp(0.55rem, 2vw, 0.7rem);
            font-weight: bold;
            text-align: center;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: grab;
        }

        .sio-card.selected {
            border: 2px solid var(--forest);
            background: #e4eadf;
        }

        .sio-card.unavailable {
            opacity: 0.48;
            border-style: dashed;
        }

        .sio-card.dragging {
            opacity: 0.65;
        }

        .material-card {
            position: relative;
            min-width: 0;
            min-height: 0;
            border: 2px solid transparent;
            border-radius: 13px;
            background: var(--white);
            box-shadow: var(--shadow);
            overflow: hidden;
            cursor: grab;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            perspective: 600px;
        }

        .material-card.selected {
            border-color: var(--tea);
            opacity: 1;
        }

        .material-card.dragging {
            opacity: 0.75;
            z-index: 50;
            box-shadow: 0 12px 28px rgba(0,0,0,0.2);
        }

        .card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.35s ease;
        }

        .material-card.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .card-back {
            transform: rotateY(180deg);
        }

        .card-face img {
            width: 100%;
            height: 68%;
            min-height: 0;
            object-fit: cover;
            pointer-events: none;
        }

        .card-name {
            flex: 1;
            min-height: 0;
            padding: 3px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--forest);
            font-size: clamp(0.65rem, 2.5vw, 0.82rem);
            font-weight: bold;
            text-align: center;
            line-height: 1.15;
        }

        .card-play {
            position: absolute;
            top: 5px;
            right: 5px;
            width: 27px;
            height: 27px;
            border: none;
            border-radius: 50%;
            background: rgba(56, 92, 69, 0.92);
            color: white;
            display: none;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            z-index: 5;
            pointer-events: none;
        }

        .material-card.is-playing .card-play {
            display: flex;
            background: var(--earth);
        }

        .flip-mark {
            position: absolute;
            left: 5px;
            top: 5px;
            padding: 3px 6px;
            border-radius: 10px;
            background: rgba(255,255,255,0.88);
            color: var(--forest);
            font-size: 0.6rem;
            pointer-events: none;
        }

        /* 拼貼區 */

        .collage-panel {
            min-height: 0;
            padding: 8px 10px;
            border-radius: 16px;
            background: var(--paper);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .collage-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .collage-heading h2 {
            margin: 0;
            color: var(--forest);
            font-size: 0.9rem;
        }

        .collage-heading span {
            color: var(--muted);
            font-size: 0.68rem;
        }

        /*
           拼貼素材區：
           改用格狀排列，素材多時只在此區域捲動。
        */

        .drop-area {
            min-height: 0;
            flex: 1;

            border: 2px dashed rgba(56, 92, 69, 0.35);
            border-radius: 11px;
            padding: 6px;

            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(76px, 1fr));
            grid-auto-rows: 96px;
            align-content: start;
            gap: 7px;

            overflow-x: hidden;
            overflow-y: auto;
            overscroll-behavior: contain;
            touch-action: pan-y;

            /* Firefox */
            scrollbar-width: thin;
            scrollbar-color: #FFFFFF rgba(255, 255, 255, 0.25);
        }

        /* Chromium、Chrome、Edge 與部分 Android 瀏覽器的捲動條 */
        .drop-area::-webkit-scrollbar {
            width: 8px;
        }

        .drop-area::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
        }

        .drop-area::-webkit-scrollbar-thumb {
            background: #FFFFFF;
            border-radius: 10px;
            border: 1px solid rgba(56, 92, 69, 0.15);
        }

        .drop-area::-webkit-scrollbar-thumb:hover {
            background: #FFFFFF;
        }

        .drop-area.drag-over {
            background: rgba(120, 148, 119, 0.2);
            border-color: var(--forest);
        }

        .drop-hint {
            grid-column: 1 / -1;
            width: 100%;
            height: 100%;
            min-height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            text-align: center;
            font-size: 0.75rem;
        }

        /* 拼貼區中的單一素材卡片 */

        .collage-item {
            position: relative;
            width: 100%;
            height: 100%;
            min-width: 0;
            min-height: 0;
            border-radius: 8px;
            overflow: hidden;
            background: var(--white);
            box-shadow: 0 2px 6px rgba(56, 92, 69, 0.1);
        }

        .collage-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 素材名稱與版本 */

        .collage-item-info {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 15px 4px 5px;
            background: linear-gradient(
                transparent,
                rgba(255,255,255,0.96) 40%
            );
            color: var(--forest);
            text-align: center;
            pointer-events: none;
        }

        .collage-item-title {
            display: block;
            font-size: 0.66rem;
            font-weight: bold;
            line-height: 1.2;
            overflow-wrap: anywhere;
        }

        .collage-item-version {
            display: block;
            margin-top: 2px;
            font-size: 0.58rem;
            line-height: 1.15;
            color: var(--muted);
        }

        /* 移除按鈕 */

        .remove-item {
            position: absolute;
            top: 3px;
            right: 3px;
            width: 22px;
            height: 22px;
            border: none;
            border-radius: 50%;
            background: rgba(56, 92, 69, 0.92);
            color: white;
            font-size: 0.85rem;
            line-height: 1;
            z-index: 3;
            cursor: pointer;
        }

        .collage-actions {
            display: flex;
            gap: 7px;
            margin-top: 6px;
            flex-shrink: 0;
        }

        .collage-actions button {
            min-height: 31px;
            border: none;
            border-radius: 18px;
            font-size: 0.78rem;
            font-weight: bold;
            cursor: pointer;
        }

        .clear-btn {
            padding: 0 13px;
            background: var(--white);
            color: var(--forest);
        }

        .confirm-btn {
            flex: 1;
            background: var(--forest);
            color: white;
        }

        .confirm-btn:disabled {
            background: #c5c8bd;
            cursor: not-allowed;
        }

        .confirm-btn.playing {
            background: var(--earth);
        }

        /* 拖曳提示 */

        .drag-ghost {
            position: fixed;
            z-index: 9999;
            width: 90px;
            height: 90px;
            border-radius: 12px;
            object-fit: cover;
            pointer-events: none;
            opacity: 0.85;
            box-shadow: 0 8px 25px rgba(0,0,0,0.25);
            transform: translate(-50%, -50%);
        }

        /* 逐步操作導覽 */

        .tour-overlay {
            position: fixed;
            inset: 0;
            z-index: 10000;
            pointer-events: none;
            display: none;
        }

        .tour-overlay.active {
            display: block;
        }

        .tour-shade {
            position: absolute;
            background: rgba(0, 0, 0, 0.62);
            pointer-events: auto;
        }

        .tour-bubble {
            position: absolute;
            z-index: 10002;
            width: min(270px, calc(100vw - 36px));
            padding: 13px 14px;
            border-radius: 15px;
            background: white;
            color: var(--text);
            box-shadow: 0 8px 28px rgba(0,0,0,0.25);
            pointer-events: auto;
        }

        .tour-bubble::before {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            background: white;
            transform: rotate(45deg);
        }

        .tour-bubble.arrow-top::before {
            top: -6px;
            left: 25px;
        }

        .tour-bubble.arrow-bottom::before {
            bottom: -6px;
            left: 25px;
        }

        .tour-bubble.arrow-left::before {
            left: -6px;
            top: 22px;
        }

        .tour-bubble.arrow-right::before {
            right: -6px;
            top: 22px;
        }

        .tour-step-count {
            color: var(--tea);
            font-size: 0.68rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .tour-bubble h3 {
            margin: 0 0 5px;
            color: var(--forest);
            font-size: 0.95rem;
        }

        .tour-bubble p {
            margin: 0;
            color: var(--muted);
            font-size: 0.78rem;
            line-height: 1.5;
        }

        .tour-controls {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-top: 12px;
        }

        .tour-controls button {
            border: none;
            border-radius: 18px;
            padding: 7px 13px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
        }

        .tour-prev {
            background: var(--paper);
            color: var(--forest);
        }

        .tour-next {
            margin-left: auto;
            background: var(--forest);
            color: white;
        }

        .tour-skip {
            background: var(--paper);
            color: var(--forest);
        }

        .tour-prev:disabled {
            opacity: 0.35;
            cursor: default;
        }

        /* 直向手機 */

        @media (orientation: portrait) {
            .app {
                grid-template-rows:
                    auto
                    minmax(0, 1.05fr)
                    minmax(0, 0.95fr)
                    minmax(0, 0.72fr);
            }
        }

        /* 橫向手機 */

        @media (orientation: landscape) {
            .app {
                padding: 7px 12px;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows:
                    auto
                    minmax(0, 1fr)
                    minmax(0, 0.9fr);
                gap: 7px 10px;
            }

            .header {
                grid-column: 1 / -1;
                min-height: 28px;
            }

            .main-panel {
                grid-column: 1;
                grid-row: 2;

                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
                grid-template-rows: minmax(0, 1fr);

                gap: 8px;
                padding: 8px;
            }

            .main-image-wrap {
                min-height: 0;
                min-width: 0;
            }

            .main-info {
                min-width: 0;
                min-height: 0;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: stretch;
                overflow: hidden;
            }

            .main-info h2 {
                font-size: clamp(0.85rem, 2.2vw, 1.1rem);
                margin: 0 0 5px;
            }

            .main-info p {
                display: -webkit-box;
                -webkit-box-orient: vertical;
                -webkit-line-clamp: 4;
                overflow: hidden;
                font-size: clamp(0.68rem, 1.7vw, 0.82rem);
                line-height: 1.45;
            }

            .version-label {
                display: inline-block;
                align-self: flex-start;
                margin-top: 5px;
                font-size: 0.65rem;
            }

            .version-label[hidden] {
                display: none;
            }

            .main-play {
                width: 100%;
                min-height: 30px;
                margin-top: 7px;
                font-size: 0.75rem;
            }

            .materials-panel {
                grid-column: 2;
                grid-row: 2;
                gap: 5px;
            }

            .field-materials-grid {
                gap: 7px;
            }

            .sio-section {
                padding: 4px 6px;
            }

            .sio-card {
                min-height: 26px;
                padding: 3px 1px;
            }

            .card-face img {
                height: 68%;
            }

            .card-name {
                font-size: clamp(0.62rem, 1.8vw, 0.78rem);
            }

            .collage-panel {
                grid-column: 1 / -1;
                grid-row: 3;
                padding: 7px 10px;
            }

            .drop-area {
                grid-template-columns: repeat(auto-fill, minmax(78px, 1fr));
                grid-auto-rows: 88px;
                min-height: 0;
                flex: 1;
                padding: 5px;
                gap: 6px;
            }

            .collage-actions {
                margin-top: 5px;
            }

            .collage-actions button {
                min-height: 32px;
            }
        }

        /* 較矮的橫向手機 */

        @media (max-height: 420px) and (orientation: landscape) {
            .app {
                padding: 4px 9px;
                grid-template-rows:
                    auto
                    minmax(0, 1fr)
                    minmax(0, 0.9fr);
                gap: 5px 8px;
            }

            .header {
                min-height: 23px;
            }

            .header h1 {
                font-size: 0.9rem;
            }

            .main-panel {
                padding: 6px;
                gap: 6px;
            }

            .main-info h2 {
                font-size: 0.85rem;
            }

            .main-info p {
                -webkit-line-clamp: 3;
                font-size: 0.65rem;
                line-height: 1.35;
            }

            .version-label {
                margin-top: 3px;
                padding: 2px 7px;
                font-size: 0.6rem;
            }

            .main-play {
                min-height: 27px;
                margin-top: 5px;
                font-size: 0.7rem;
            }

            .materials-panel,
            .field-materials-grid {
                gap: 5px;
            }

            .sio-section-heading {
                margin-bottom: 2px;
            }

            .sio-card {
                min-height: 23px;
                font-size: 0.55rem;
            }

            .collage-panel {
                padding: 5px 8px;
            }

            .collage-heading {
                margin-bottom: 3px;
            }

            .drop-area {
                grid-auto-rows: 76px;
                padding: 4px;
                gap: 5px;
            }

            .collage-item-title {
                font-size: 0.6rem;
            }

            .collage-item-version {
                font-size: 0.54rem;
            }

            .collage-actions {
                margin-top: 3px;
            }

            .collage-actions button {
                min-height: 29px;
            }
        }

        @media (max-width: 350px) and (orientation: portrait) {
            .app {
                padding-left: 10px;
                padding-right: 10px;
            }

            .materials-panel,
            .field-materials-grid {
                gap: 5px;
            }

            .card-name {
                font-size: 0.62rem;
            }

            .header a {
                font-size: 0.78rem;
            }

            .header h1 {
                font-size: 0.9rem;
            }

            .drop-area {
                grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
                grid-auto-rows: 90px;
                gap: 5px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- 頁首 -->
    <header class="header" id="header">
        <a href="index.html" id="backHome">← 回到主頁</a>
        <h1 id="pageTitle">一心二葉・坪心而唱</h1>
        <div class="header-tools">
            <div class="lang-switch" aria-label="Language">
                <button type="button" id="langZh" onclick="setLang('zh')">中</button>
                <button type="button" id="langEn" onclick="setLang('en')">EN</button>
            </div>
            <button class="help-btn" id="helpBtn" aria-label="操作說明">?</button>
        </div>
    </header>

    <!-- 主畫面 -->
    <section class="main-panel" id="mainPanel">

        <div class="main-image-wrap">
            <img
                id="mainImage"
                class="main-image"
                alt="聲音素材圖片"
            >

            <div class="main-placeholder" id="mainPlaceholder">
                <div class="placeholder-icon">♧</div>
                <div id="placeholderTitle">請點選下方素材</div>
                <div id="placeholderDescription">查看圖片與聲音介紹</div>
            </div>
        </div>

        <div class="main-info">
            <h2 id="mainTitle">尚未選擇素材</h2>

            <p id="mainDescription">
                選擇下方任一素材，即可在這裡查看相關介紹。
            </p>

            <span class="version-label" id="versionLabel" hidden>
                原始聲音
            </span>

            <button class="main-play" id="mainPlayBtn" disabled>
                ▶ 播放素材
            </button>
        </div>

    </section>

    <!-- 素材縮圖 -->
    <section class="materials-panel" id="materialsPanel"></section>

    <!-- 拼貼區 -->
    <section class="collage-panel" id="collagePanel">

        <div class="collage-heading">
            <h2 id="collageTitle">聲音拼貼</h2>
            <span id="collageCount">已放入 0 個素材</span>
        </div>

        <div class="drop-area" id="dropArea">
            <div class="drop-hint" id="dropHint">
                長按素材並拖曳至此
            </div>
        </div>

        <div class="collage-actions">
            <button class="clear-btn" id="clearBtn">
                清空
            </button>

            <button class="confirm-btn" id="confirmBtn" disabled>
                ▶ 確認拼貼
            </button>
        </div>

    </section>

</div>


<!-- 逐步操作導覽 -->
<div class="tour-overlay" id="tourOverlay">

    <div class="tour-shade" id="shadeTop"></div>
    <div class="tour-shade" id="shadeLeft"></div>
    <div class="tour-shade" id="shadeRight"></div>
    <div class="tour-shade" id="shadeBottom"></div>

    <div class="tour-bubble" id="tourBubble">

        <div class="tour-step-count" id="tourStepCount">
            STEP 1 / 5
        </div>

        <h3 id="tourTitle"></h3>

        <p id="tourDescription"></p>

        <div class="tour-controls">
            <button class="tour-prev" id="tourPrev">上一步</button>
            <button class="tour-skip" id="tourSkip" hidden>略過</button>
            <button class="tour-next" id="tourNext">下一步 →</button>
        </div>

    </div>

</div>


<script>
    /* =================================================
       素材資料設定
    ================================================= */


    /* =================================================
       中英文介面
       與首頁共用 localStorage 的 prefLang
    ================================================= */

    const languageText = {
        zh: {
            backHome: "← 回到主頁",
            pageTitle: "一心二葉・坪心而唱",
            helpLabel: "操作說明",
            placeholderTitle: "請點選下方素材",
            placeholderDescription: "查看圖片與聲音介紹",
            notSelected: "尚未選擇素材",
            selectDescription: "選擇下方任一素材，即可在這裡查看相關介紹。",
            original: "原始聲音",
            processed: "加工後的聲音",
            processedShort: "加工版",
            play: "▶ 播放素材",
            pause: "Ⅱ 暫停素材",
            collage: "聲音拼貼",
            dropHint: "長按素材並拖曳至此",
            clear: "清空",
            confirm: "▶ 確認拼貼",
            stop: "■ 停止拼貼",
            remove: "移除",
            sioSection: "相褒歌",
            sioRule: "六段擇一",
            sioRecording: "相褒歌錄音",
            previous: "上一步",
            skip: "略過",
            next: "下一步 →",
            finish: "完成 ✓",
            count: n => `已放入 ${n} 個素材`,
            step: (n, total) => `步驟 ${n} / ${total}`,
            tour: [
                ["① 選擇聲音素材", "點擊素材，可以查看圖片與介紹，並播放或暫停聲音。"],
                ["② 聆聽與認識素材", "這裡會顯示所選素材的圖片、介紹，以及播放控制。"],
                ["③ 切換聲音版本", "在素材格子上左右滑動，即可切換原始聲音與加工版本。"],
                ["④ 加入田野聲音", "長按五種田野聲音素材並拖曳至下方拼貼區。每種素材的原始版與加工版可以同時加入。"],
                ["⑤ 選擇相褒歌", "相褒歌共有六段錄音，可以切換聆聽，但拼貼中最多只能加入其中一段。若要更換，請先移除已加入的相褒歌，再選擇另一段。"],
                ["⑥ 完成你的聲音風景", "加入素材後，按下「確認拼貼」播放組合聲音。五種田野聲音依原始版、加工版排序；相褒歌使用所選段落的原音檔。也可以在拼貼區內捲動查看。"]
            ],
            playError: "目前無法播放這個音檔，請確認音檔路徑是否正確。",
            collageError: "拼貼音檔尚未準備完成，請確認音檔路徑。"
        },
        en: {
            backHome: "← Home",
            pageTitle: "Pinglin Sio-Po-Kua",
            helpLabel: "Help",
            placeholderTitle: "Select a sound below",
            placeholderDescription: "View its image and description",
            notSelected: "No sound selected",
            selectDescription: "Select any sound below to view its details here.",
            original: "Original Audio",
            processed: "Processed",
            processedShort: "Processed",
            play: "▶ Play",
            pause: "Ⅱ Pause",
            collage: "Sound Collage",
            dropHint: "Press and hold a sound, then drag it here",
            clear: "Clear",
            confirm: "▶ Play Collage",
            stop: "■ Stop Collage",
            remove: "Remove",
            sioSection: "Sio-Po-Kua",
            sioRule: "Choose one of six",
            sioRecording: "Sio-Po-Kua recording",
            previous: "Previous",
            skip: "Skip",
            next: "Next →",
            finish: "Done ✓",
            count: n => `${n} sound${n === 1 ? "" : "s"} added`,
            step: (n, total) => `STEP ${n} / ${total}`,
            tour: [
                ["① Choose a Sound", "Tap a sound to view its image and description, then play or pause it."],
                ["② Listen and Explore", "The selected sound's image, description, and playback controls appear here."],
                ["③ Switch Sound Versions", "Swipe a sound card horizontally to switch between its original and processed versions."],
                ["④ Add Field Sounds", "Press and hold any of the five field recordings, then drag it into the collage area. You can add both the original and processed versions of each field sound."],
                ["⑤ Choose a Sio-Po-Kua Recording", "There are six recordings to preview, but you can add only one to the collage. To switch recordings, remove the one already added before choosing another."],
                ["⑥ Create Your Soundscape", "Press “Play Collage” to hear your sounds together. The five field sounds are arranged by original and processed versions; the selected Sio-Po-Kua recording plays from its own audio file. Scroll within the collage area to view all items."]
            ],
            playError: "This audio file could not be played. Please check that the file path is correct.",
            collageError: "The collage audio is not ready. Please check the audio file paths."
        }
    };

    let currentLang = "zh";

    function tr(key) {
        return languageText[currentLang][key];
    }

    function materialName(item) {
        return currentLang === "en" ? item.titleEn : item.title;
    }

    function materialDescription(item) {
        return currentLang === "en" ? item.descriptionEn : item.description;
    }

    const sioSongs = Array.from({ length: 6 }, (_, index) => {
        const number = index + 1;
        return {
            id: `sio_po_kua_${number}`,
            type: "sio",
            title: `相褒歌 ${number}`,
            titleEn: `Sio-Po-Kua ${number}`,
            description: `相褒歌第 ${number} 段田野錄音。`,
            descriptionEn: `Sio-Po-Kua field recording ${number}.`,
            audio: `audio/sio_po_kua_${number}.mp3`
        };
    });

    function setLang(lang) {
        if (!languageText[lang]) lang = "zh";
        currentLang = lang;

        document.documentElement.lang = lang === "zh" ? "zh-TW" : "en";
        document.title = lang === "zh"
            ? "聲音採集與拼貼｜一心二葉・坪心而唱"
            : "Sound Exploration & Collage | Pinglin Sio-Po-Kua";

        document.getElementById("backHome").textContent = tr("backHome");
        document.getElementById("pageTitle").textContent = tr("pageTitle");
        document.getElementById("helpBtn").setAttribute("aria-label", tr("helpLabel"));
        document.getElementById("placeholderTitle").textContent = tr("placeholderTitle");
        document.getElementById("placeholderDescription").textContent = tr("placeholderDescription");
        document.getElementById("collageTitle").textContent = tr("collage");

        // 相褒歌區塊是在 renderMaterials() 動態建立，切換語言時需同步更新。
        const sioHeading = document.querySelector(".sio-section-heading span");
        const sioRule = document.querySelector(".sio-section-heading small");
        if (sioHeading) sioHeading.textContent = tr("sioSection");
        if (sioRule) sioRule.textContent = tr("sioRule");

        // 尚未選取素材時，也要更新主畫面預設的版本標籤。
        if (!currentMaterial) versionLabel.textContent = tr("original");

        document.getElementById("clearBtn").textContent = tr("clear");
        document.getElementById("confirmBtn").textContent = collagePlaying ? tr("stop") : tr("confirm");
        document.getElementById("tourPrev").textContent = tr("previous");
        document.getElementById("tourSkip").textContent = tr("skip");

        document.getElementById("langZh").classList.toggle("active", lang === "zh");
        document.getElementById("langEn").classList.toggle("active", lang === "en");
        document.getElementById("langZh").setAttribute("aria-pressed", lang === "zh");
        document.getElementById("langEn").setAttribute("aria-pressed", lang === "en");

        try {
            localStorage.setItem("prefLang", lang);
        } catch (error) {
            // 若瀏覽器不允許儲存，仍可在目前頁面切換語言。
        }

        // 更新素材卡片文字，保留目前的翻面、選取與播放狀態。
        document.querySelectorAll(".material-card").forEach(card => {
            const item = materials.find(material => material.id === card.dataset.id);
            if (!item) return;

            card.querySelector(".card-front .card-name").textContent = materialName(item);
            card.querySelector(".card-back .card-name").textContent =
                currentLang === "en" ? `${materialName(item)} · Processed` : `${materialName(item)}・加工版`;
            card.querySelector(".flip-mark").textContent =
                card.dataset.version === "processed"
                    ? (currentLang === "en" ? "Processed" : "加工版")
                    : (currentLang === "en" ? "Original" : "原始");
            card.querySelectorAll("img").forEach(img => img.alt = materialName(item));
        });

        document.querySelectorAll(".sio-card").forEach(card => {
            const song = sioSongs.find(item => item.id === card.dataset.id);
            if (song) card.textContent = materialName(song);
        });
        updateSioCardStates();

        if (currentMaterial) {
            mainTitle.textContent = materialName(currentMaterial);
            mainDescription.textContent = materialDescription(currentMaterial);
            if (currentMaterial.type === "sio") {
                document.getElementById("placeholderTitle").textContent = materialName(currentMaterial);
                document.getElementById("placeholderDescription").textContent = materialDescription(currentMaterial);
            } else {
                mainImage.alt = materialName(currentMaterial);
                versionLabel.textContent = currentVersion === "original" ? tr("original") : tr("processed");
            }
        } else {
            mainTitle.textContent = tr("notSelected");
            mainDescription.textContent = tr("selectDescription");
        }

        updatePreviewButton();
        renderCollage();

        if (tourOverlay.classList.contains("active")) {
            showTourStep();
        }
    }


    const materials = [
        {
            id: "single_1",
            title: "走路聲",
            titleEn: "Footsteps",
            image: "images/photo_2_1.jpg",
            description: "坪林田野採集的走路聲音素材。",
            descriptionEn: "Footstep sounds recorded in the fields of Pinglin.",
            original: "audio/single_1.mp3",
            processed: "audio/processed_single_1.mp3",
            collageOriginal: "audio/collage_1_original.mp3",
            collageProcessed: "audio/collage_1_processed.mp3"
        },
        {
            id: "single_2",
            title: "蟲鳴鳥叫聲",
            titleEn: "Insects and Birds",
            image: "images/photo_2_2.jpg",
            description: "坪林山林中的蟲鳴與鳥叫聲。",
            descriptionEn: "Insect and bird sounds from the forests of Pinglin.",
            original: "audio/single_2.mp3",
            processed: "audio/processed_single_2.mp3",
            collageOriginal: "audio/collage_2_original.mp3",
            collageProcessed: "audio/collage_2_processed.mp3"
        },
        {
            id: "single_3",
            title: "河流聲",
            titleEn: "River",
            image: "images/photo_2_3.jpg",
            description: "採集自坪林河流的流水聲。",
            descriptionEn: "The sound of flowing water recorded along a river in Pinglin.",
            original: "audio/single_3.mp3",
            processed: "audio/processed_single_3.mp3",
            collageOriginal: "audio/collage_3_original.mp3",
            collageProcessed: "audio/collage_3_processed.mp3"
        },
        {
            id: "single_4",
            title: "採茶聲",
            titleEn: "Tea Picking",
            image: "images/photo_2_4.jpg",
            description: "採集採摘茶葉時所產生的聲音。",
            descriptionEn: "Sounds recorded while picking tea leaves.",
            original: "audio/single_4.mp3",
            processed: "audio/processed_single_4.mp3",
            collageOriginal: "audio/collage_4_original.mp3",
            collageProcessed: "audio/collage_4_processed.mp3"
        },
        {
            id: "single_5",
            title: "竹簍掃動茶葉聲",
            titleEn: "Bamboo Basket Sweeping Tea Leaves",
            image: "images/photo_2_5.jpg",
            description: "竹簍掃動茶葉時所產生的聲音。",
            descriptionEn: "The sound of a bamboo basket sweeping tea leaves.",
            original: "audio/single_5.mp3",
            processed: "audio/processed_single_5.mp3",
            collageOriginal: "audio/collage_5_original.mp3",
            collageProcessed: "audio/collage_5_processed.mp3"
        }
    ];


    /* =================================================
       狀態
    ================================================= */

    let currentMaterial = null;
    let currentVersion = null;

    let previewAudio = new Audio();
    previewAudio.loop = true;

    let collageItems = [];
    let tonePlayers = [];
    let collagePlaying = false;

    const materialsPanel = document.getElementById("materialsPanel");
    const dropArea = document.getElementById("dropArea");

    const mainImage = document.getElementById("mainImage");
    const mainPlaceholder = document.getElementById("mainPlaceholder");
    const mainTitle = document.getElementById("mainTitle");
    const mainDescription = document.getElementById("mainDescription");
    const versionLabel = document.getElementById("versionLabel");
    const mainPlayBtn = document.getElementById("mainPlayBtn");

    const confirmBtn = document.getElementById("confirmBtn");
    const clearBtn = document.getElementById("clearBtn");


    /* =================================================
       逐步操作導覽
    ================================================= */

    const tourOverlay = document.getElementById("tourOverlay");
    const tourBubble = document.getElementById("tourBubble");

    const tourTargets = [
        { target: "fieldMaterialsGrid", placement: "top" },
        { target: "mainPanel", placement: "bottom" },
        { target: "fieldMaterialsGrid", placement: "top" },
        { target: "collagePanel", placement: "top" },
        { target: "sioSection", placement: "top" },
        { target: "collagePanel", placement: "top" }
    ];

    function getTourSteps() {
        return languageText[currentLang].tour.map((entry, index) => ({
            target: tourTargets[index].target,
            placement: tourTargets[index].placement,
            title: entry[0],
            description: entry[1]
        }));
    }

    let currentTourStep = 0;

    const shadeTop = document.getElementById("shadeTop");
    const shadeLeft = document.getElementById("shadeLeft");
    const shadeRight = document.getElementById("shadeRight");
    const shadeBottom = document.getElementById("shadeBottom");

    const tourStepCount = document.getElementById("tourStepCount");
    const tourTitle = document.getElementById("tourTitle");
    const tourDescription = document.getElementById("tourDescription");

    const tourPrev = document.getElementById("tourPrev");
    const tourNext = document.getElementById("tourNext");


    function openTour(showSkip = false) {
        currentTourStep = 0;

        document.getElementById("tourSkip").hidden = !showSkip;

        tourOverlay.classList.add("active");

        requestAnimationFrame(showTourStep);
    }

    function closeTour() {
        tourOverlay.classList.remove("active");
    }

    function showTourStep() {
        const tourSteps = getTourSteps();
        const step = tourSteps[currentTourStep];
        const target = document.getElementById(step.target);

        if (!target) return;

        const rect = target.getBoundingClientRect();

        const width = window.innerWidth;
        const height = window.innerHeight;

        const left = Math.max(0, rect.left - 5);
        const top = Math.max(0, rect.top - 5);
        const right = Math.min(width, rect.right + 5);
        const bottom = Math.min(height, rect.bottom + 5);

        /* 四個遮罩區塊，留下目標區域 */

        shadeTop.style.left = "0";
        shadeTop.style.top = "0";
        shadeTop.style.width = width + "px";
        shadeTop.style.height = top + "px";

        shadeLeft.style.left = "0";
        shadeLeft.style.top = top + "px";
        shadeLeft.style.width = left + "px";
        shadeLeft.style.height = (bottom - top) + "px";

        shadeRight.style.left = right + "px";
        shadeRight.style.top = top + "px";
        shadeRight.style.width = (width - right) + "px";
        shadeRight.style.height = (bottom - top) + "px";

        shadeBottom.style.left = "0";
        shadeBottom.style.top = bottom + "px";
        shadeBottom.style.width = width + "px";
        shadeBottom.style.height = (height - bottom) + "px";

        tourStepCount.textContent =
            tr("step")(currentTourStep + 1, tourSteps.length);

        tourTitle.textContent = step.title;
        tourDescription.textContent = step.description;

        tourPrev.disabled = currentTourStep === 0;

        if (currentTourStep === tourSteps.length - 1) {
            tourNext.textContent = tr("finish");
        } else {
            tourNext.textContent = tr("next");
        }

        /* 提示框位置 */

        tourBubble.className = "tour-bubble";

        const bubbleWidth = Math.min(270, width - 36);
        const bubbleHeight = tourBubble.offsetHeight || 145;

        let bubbleLeft = 18;
        let bubbleTop;

        if (step.placement === "top") {
            bubbleTop = top - bubbleHeight - 13;

            if (bubbleTop < 10) {
                bubbleTop = bottom + 13;
                tourBubble.classList.add("arrow-top");
            } else {
                tourBubble.classList.add("arrow-bottom");
            }

            bubbleLeft = Math.max(
                18,
                Math.min(left + 10, width - bubbleWidth - 18)
            );

        } else {
            bubbleTop = bottom + 13;

            if (bubbleTop + bubbleHeight > height - 10) {
                bubbleTop = top - bubbleHeight - 13;
                tourBubble.classList.add("arrow-bottom");
            } else {
                tourBubble.classList.add("arrow-top");
            }

            bubbleLeft = Math.max(
                18,
                Math.min(left + 10, width - bubbleWidth - 18)
            );
        }

        bubbleTop = Math.max(
            10,
            Math.min(bubbleTop, height - bubbleHeight - 10)
        );

        tourBubble.style.left = bubbleLeft + "px";
        tourBubble.style.top = bubbleTop + "px";
    }

    tourPrev.addEventListener("click", () => {
        if (currentTourStep > 0) {
            currentTourStep--;
            showTourStep();
        }
    });

    tourNext.addEventListener("click", () => {
        if (currentTourStep < getTourSteps().length - 1) {
            currentTourStep++;
            showTourStep();
        } else {
            closeTour();
        }
    });

    document.getElementById("helpBtn").addEventListener("click", () => {
        openTour(true);
    });

    document.getElementById("tourSkip").addEventListener("click", closeTour);

    window.addEventListener("resize", () => {
        if (tourOverlay.classList.contains("active")) {
            showTourStep();
        }
    });


    /* =================================================
       建立素材格子
    ================================================= */

    function renderMaterials() {
        materialsPanel.innerHTML = `
            <div class="field-materials-grid" id="fieldMaterialsGrid"></div>
            <section class="sio-section" id="sioSection">
                <div class="sio-section-heading">
                    <span>${tr("sioSection")}</span>
                    <small>${tr("sioRule")}</small>
                </div>
                <div class="sio-song-list" id="sioSongList"></div>
            </section>
        `;

        const fieldGrid = document.getElementById("fieldMaterialsGrid");

        materials.forEach(item => {
            const card = document.createElement("div");
            card.className = "material-card";
            card.dataset.id = item.id;
            card.dataset.version = "original";
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-face card-front">
                        <img src="${item.image}" alt="${materialName(item)}">
                        <div class="card-name">${materialName(item)}</div>
                    </div>
                    <div class="card-face card-back">
                        <img src="${item.image}" alt="${materialName(item)}">
                        <div class="card-name">${currentLang === "en" ? `${materialName(item)} · Processed` : `${materialName(item)}・加工版`}</div>
                    </div>
                </div>
                <span class="flip-mark">${currentLang === "en" ? "Original" : "原始"}</span>
                <span class="card-play">Ⅱ</span>
            `;
            fieldGrid.appendChild(card);
            attachCardEvents(card, item);
        });

        const songList = document.getElementById("sioSongList");
        sioSongs.forEach(song => {
            const card = document.createElement("button");
            card.type = "button";
            card.className = "sio-card";
            card.dataset.id = song.id;
            card.textContent = materialName(song);
            card.setAttribute("aria-label", materialName(song));
            songList.appendChild(card);
            attachSioCardEvents(card, song);
        });

        updateSioCardStates();
    }

    function updateSioCardStates() {
        const selectedSong = collageItems.find(item => item.type === "sio");
        document.querySelectorAll(".sio-card").forEach(card => {
            const isSelected = selectedSong && selectedSong.id === card.dataset.id;
            const unavailable = selectedSong && selectedSong.id !== card.dataset.id;
            card.classList.toggle("selected", !!isSelected);
            card.classList.toggle("unavailable", !!unavailable);
            card.setAttribute("aria-pressed", isSelected ? "true" : "false");
            card.title = unavailable
                ? (currentLang === "en"
                    ? "Remove the selected Sio-Po-Kua recording before adding another."
                    : "請先移除已加入的相褒歌，才能更換段落。")
                : (sioSongs.find(song => song.id === card.dataset.id) ? materialName(sioSongs.find(song => song.id === card.dataset.id)) : "");
        });
    }

    function attachSioCardEvents(card, song) {
        let startX = 0, startY = 0, startTime = 0;
        let active = false, longPressed = false, moved = false, dragging = false;
        let pointerId = null, timer = null, ghost = null;

        const clearState = () => {
            clearTimeout(timer);
            timer = null;
            card.classList.remove("dragging");
            dropArea.classList.remove("drag-over");
            if (ghost) { ghost.remove(); ghost = null; }
            dragging = false;
        };

        card.addEventListener("contextmenu", event => event.preventDefault());
        card.addEventListener("pointerdown", event => {
            if (event.pointerType === "mouse" && event.button !== 0) return;
            if (active) return;
            event.preventDefault();
            active = true;
            pointerId = event.pointerId;
            startX = event.clientX;
            startY = event.clientY;
            startTime = Date.now();
            longPressed = false;
            moved = false;
            dragging = false;
            try { card.setPointerCapture(event.pointerId); } catch (error) {}
            timer = setTimeout(() => {
                if (active && pointerId === event.pointerId) longPressed = true;
            }, LONG_PRESS_TIME);
        });

        card.addEventListener("pointermove", event => {
            if (!active || event.pointerId !== pointerId) return;
            const dx = event.clientX - startX, dy = event.clientY - startY;
            if (Math.abs(dx) > MOVE_CANCEL_DISTANCE || Math.abs(dy) > MOVE_CANCEL_DISTANCE) moved = true;

            if (longPressed && moved) {
                if (!dragging) {
                    dragging = true;
                    card.classList.add("dragging");
                    ghost = document.createElement("div");
                    ghost.className = "drag-ghost";
                    ghost.style.width = "110px";
                    ghost.style.height = "58px";
                    ghost.style.display = "flex";
                    ghost.style.alignItems = "center";
                    ghost.style.justifyContent = "center";
                    ghost.style.background = "white";
                    ghost.style.color = "var(--forest)";
                    ghost.style.fontWeight = "bold";
                    ghost.textContent = materialName(song);
                    document.body.appendChild(ghost);
                }
                if (ghost) {
                    ghost.style.left = event.clientX + "px";
                    ghost.style.top = event.clientY + "px";
                }
                const rect = dropArea.getBoundingClientRect();
                dropArea.classList.toggle("drag-over",
                    event.clientX >= rect.left && event.clientX <= rect.right &&
                    event.clientY >= rect.top && event.clientY <= rect.bottom);
            }
        });

        card.addEventListener("pointerup", event => {
            if (!active || event.pointerId !== pointerId) return;
            const elapsed = Date.now() - startTime;
            const dx = event.clientX - startX, dy = event.clientY - startY;
            active = false;
            pointerId = null;
            clearTimeout(timer);
            timer = null;

            if (dragging) {
                const rect = dropArea.getBoundingClientRect();
                const over = event.clientX >= rect.left && event.clientX <= rect.right &&
                    event.clientY >= rect.top && event.clientY <= rect.bottom;
                if (over) addToCollage(song, "sio");
                clearState();
                return;
            }

            clearState();
            if (!longPressed && !moved && elapsed < LONG_PRESS_TIME &&
                Math.abs(dx) < SWIPE_DISTANCE && Math.abs(dy) < MOVE_CANCEL_DISTANCE) {
                updateMainDisplay(song, "sio");
                togglePreview(song, "sio");
            }
        });

        const cancel = event => {
            if (event.pointerId !== pointerId) return;
            active = false;
            pointerId = null;
            clearState();
        };
        card.addEventListener("pointercancel", cancel);
        card.addEventListener("lostpointercapture", cancel);
    }

    /* =================================================
       主畫面更新
    ================================================= */

    function updateMainDisplay(item, version) {
        currentMaterial = item;
        currentVersion = version;

        if (item.type === "sio") {
            mainImage.style.display = "none";
            mainPlaceholder.style.display = "flex";
            document.getElementById("placeholderTitle").textContent = materialName(item);
            document.getElementById("placeholderDescription").textContent = materialDescription(item);
            versionLabel.hidden = true;
        } else {
            mainImage.src = item.image;
            mainImage.alt = materialName(item);
            mainImage.style.display = "block";
            mainPlaceholder.style.display = "none";
            versionLabel.hidden = false;
            versionLabel.textContent =
                version === "original" ? tr("original") : tr("processed");
        }

        mainTitle.textContent = materialName(item);
        mainDescription.textContent = materialDescription(item);

        mainPlayBtn.disabled = false;

        updatePreviewButton();
    }


    /* =================================================
       單獨素材播放
    ================================================= */

    function getPreviewUrl(item, version) {
        if (item.type === "sio") return item.audio;
        return version === "original"
            ? item.original
            : item.processed;
    }

    function updatePreviewButton() {
        const isThisPlaying =
            currentMaterial &&
            !previewAudio.paused &&
            previewAudio.dataset.material === currentMaterial.id &&
            previewAudio.dataset.version === currentVersion;

        if (!currentMaterial) {
            mainPlayBtn.textContent = tr("play");
            mainPlayBtn.classList.remove("playing");
            mainPlayBtn.disabled = true;
        } else {
            mainPlayBtn.textContent =
                isThisPlaying ? tr("pause") : tr("play");

            mainPlayBtn.classList.toggle("playing", isThisPlaying);
            mainPlayBtn.disabled = false;
        }

        document.querySelectorAll(".material-card").forEach(card => {
            const isPlaying =
                !previewAudio.paused &&
                previewAudio.dataset.material === card.dataset.id &&
                previewAudio.dataset.version === card.dataset.version;

            card.classList.toggle("is-playing", isPlaying);

            const playIcon = card.querySelector(".card-play");
            playIcon.textContent = isPlaying ? "Ⅱ" : "▶";
        });
    }

    async function togglePreview(item, version) {
        const sameAudio =
            previewAudio.dataset.material === item.id &&
            previewAudio.dataset.version === version;

        if (sameAudio && !previewAudio.paused) {
            previewAudio.pause();
            updatePreviewButton();
            return;
        }

        previewAudio.pause();
        previewAudio.currentTime = 0;

        const url = getPreviewUrl(item, version);

        previewAudio.src = url;
        previewAudio.dataset.material = item.id;
        previewAudio.dataset.version = version;

        try {
            await previewAudio.play();
        } catch (error) {
            /* 快速切換時，瀏覽器可能取消尚未完成的 play() 請求。
               AbortError 不代表音檔路徑錯誤，因此不跳出錯誤視窗。 */
            if (error.name !== "AbortError") {
                console.error("素材播放失敗：", error);
                alert(tr("playError"));
            }
        }

        updatePreviewButton();
    }

    mainPlayBtn.addEventListener("click", () => {
        if (!currentMaterial) return;
        togglePreview(currentMaterial, currentVersion);
    });

    previewAudio.addEventListener("play", updatePreviewButton);
    previewAudio.addEventListener("pause", updatePreviewButton);
    previewAudio.addEventListener("ended", updatePreviewButton);


    /* =================================================
       素材操作判定

       點擊：顯示介紹並播放／暫停
       水平滑動：翻轉原始／加工版
       長按後移動：拖曳至拼貼區

       修正：
       1. 只有指標仍按住時才處理 pointermove。
       2. 放開後立即結束手勢，避免放開後的微小移動誤觸翻面。
       3. 無論拖曳到拼貼區內或外，都會清除暫時圖片。
       4. pointercancel 或失去指標捕捉時，也會清理拖曳狀態。
    ================================================= */

    const LONG_PRESS_TIME = 380;
    const SWIPE_DISTANCE = 35;
    const MOVE_CANCEL_DISTANCE = 12;

    function attachCardEvents(card, item) {
        let pointerStartX = 0;
        let pointerStartY = 0;
        let pointerStartTime = 0;

        let longPressTimer = null;
        let longPressed = false;
        let swiped = false;
        let dragging = false;
        let moved = false;

        let pointerActive = false;
        let activePointerId = null;
        let ghost = null;
        let lastTapTime = 0;

        function clearDragState() {
            clearTimeout(longPressTimer);
            longPressTimer = null;

            card.classList.remove("dragging");
            dropArea.classList.remove("drag-over");

            if (ghost) {
                ghost.remove();
                ghost = null;
            }

            dragging = false;
        }

        function endPointer() {
            pointerActive = false;
            activePointerId = null;
            clearDragState();
        }

        card.addEventListener("contextmenu", event => {
            event.preventDefault();
        });

        card.addEventListener("pointerdown", event => {
            if (event.pointerType === "mouse" && event.button !== 0) {
                return;
            }

            /* 避免同一張卡片重複開始手勢 */
            if (pointerActive) {
                return;
            }

            event.preventDefault();

            pointerActive = true;
            activePointerId = event.pointerId;

            pointerStartX = event.clientX;
            pointerStartY = event.clientY;
            pointerStartTime = Date.now();

            longPressed = false;
            swiped = false;
            dragging = false;
            moved = false;

            try {
                card.setPointerCapture(event.pointerId);
            } catch (error) {
                /* 若瀏覽器不支援捕捉，仍可使用基本點擊操作 */
            }

            longPressTimer = setTimeout(() => {
                if (pointerActive && activePointerId === event.pointerId) {
                    longPressed = true;
                }
            }, LONG_PRESS_TIME);
        });

        card.addEventListener("pointermove", event => {
            /* 放開後的 pointermove 一律忽略 */
            if (!pointerActive || event.pointerId !== activePointerId) {
                return;
            }

            const dx = event.clientX - pointerStartX;
            const dy = event.clientY - pointerStartY;

            if (
                Math.abs(dx) > MOVE_CANCEL_DISTANCE ||
                Math.abs(dy) > MOVE_CANCEL_DISTANCE
            ) {
                moved = true;
            }

            /* 長按後移動才進入拖曳模式 */
            if (longPressed && moved) {
                if (!dragging) {
                    dragging = true;
                    card.classList.add("dragging");

                    ghost = document.createElement("img");
                    ghost.src = item.image;
                    ghost.className = "drag-ghost";
                    document.body.appendChild(ghost);
                }

                if (ghost) {
                    ghost.style.left = event.clientX + "px";
                    ghost.style.top = event.clientY + "px";
                }

                const rect = dropArea.getBoundingClientRect();

                const overDropArea =
                    event.clientX >= rect.left &&
                    event.clientX <= rect.right &&
                    event.clientY >= rect.top &&
                    event.clientY <= rect.bottom;

                dropArea.classList.toggle("drag-over", overDropArea);
                return;
            }

            /* 按住期間的水平滑動才會翻轉 */
            if (
                !longPressed &&
                !swiped &&
                Math.abs(dx) > SWIPE_DISTANCE &&
                Math.abs(dx) > Math.abs(dy) * 1.2
            ) {
                swiped = true;
                clearTimeout(longPressTimer);
                longPressTimer = null;
                flipCard(card);
            }
        });

        card.addEventListener("pointerup", event => {
            if (!pointerActive || event.pointerId !== activePointerId) {
                return;
            }

            const elapsed = Date.now() - pointerStartTime;
            const dx = event.clientX - pointerStartX;
            const dy = event.clientY - pointerStartY;

            /* 先結束手勢，確保後續移動不會再觸發翻面 */
            pointerActive = false;
            activePointerId = null;

            clearTimeout(longPressTimer);
            longPressTimer = null;

            if (dragging) {
                const rect = dropArea.getBoundingClientRect();

                const overDropArea =
                    event.clientX >= rect.left &&
                    event.clientX <= rect.right &&
                    event.clientY >= rect.top &&
                    event.clientY <= rect.bottom;

                if (overDropArea) {
                    addToCollage(item, card.dataset.version);
                }

                /* 不論放開位置，都清除拖曳狀態與暫時圖片 */
                clearDragState();
                return;
            }

            clearDragState();

            /* 短按：顯示介紹並播放／暫停 */
            if (
                !longPressed &&
                !swiped &&
                !moved &&
                elapsed < LONG_PRESS_TIME &&
                Math.abs(dx) < SWIPE_DISTANCE &&
                Math.abs(dy) < MOVE_CANCEL_DISTANCE
            ) {
                const now = Date.now();

                /* 忽略同一格短時間內的第二次點擊，避免播放與暫停互相競速 */
                if (now - lastTapTime < 350) {
                    return;
                }

                lastTapTime = now;

                const version = card.dataset.version;

                updateMainDisplay(item, version);
                togglePreview(item, version);
            }
        });

        card.addEventListener("pointercancel", event => {
            if (event.pointerId !== activePointerId) {
                return;
            }

            endPointer();
        });

        card.addEventListener("lostpointercapture", event => {
            if (event.pointerId !== activePointerId) {
                return;
            }

            endPointer();
        });
    }


    /* =================================================
       翻轉素材
    ================================================= */

    function flipCard(card) {
        const isFlipped = card.classList.toggle("flipped");

        const version = isFlipped ? "processed" : "original";

        card.dataset.version = version;

        const mark = card.querySelector(".flip-mark");
        mark.textContent = isFlipped ? (currentLang === "en" ? "Processed" : "加工版") : (currentLang === "en" ? "Original" : "原始");

        const item = materials.find(
            material => material.id === card.dataset.id
        );

        if (item && currentMaterial && currentMaterial.id === item.id) {
            updateMainDisplay(item, version);

            previewAudio.pause();
            previewAudio.currentTime = 0;

            updatePreviewButton();
        }
    }


    /* =================================================
       拼貼素材排序

       依照 materials 陣列中的素材順序排列。
       同一素材的原始版會排在加工版之前。
    ================================================= */

    function sortCollageItems() {
        collageItems.sort((a, b) => {
            const indexA = a.type === "sio"
                ? materials.length + sioSongs.findIndex(song => song.id === a.id)
                : materials.findIndex(material => material.id === a.id);

            const indexB = b.type === "sio"
                ? materials.length + sioSongs.findIndex(song => song.id === b.id)
                : materials.findIndex(material => material.id === b.id);

            if (indexA !== indexB) {
                return indexA - indexB;
            }

            if (a.version === b.version) {
                return 0;
            }

            return a.version === "original" ? -1 : 1;
        });
    }


    /* =================================================
       加入拼貼區

       同一素材的不同版本可以同時加入。
       相同素材、相同版本只能加入一次。
       加入後自動依照素材順序排列。
    ================================================= */

    function addToCollage(item, version) {
        const alreadyExists = collageItems.some(
            selected => selected.id === item.id && selected.version === version
        );
        if (alreadyExists) return;

        if (item.type === "sio" && collageItems.some(selected => selected.type === "sio")) {
            return;
        }

        collageItems.push({
            id: item.id,
            type: item.type || "field",
            title: item.title,
            titleEn: item.titleEn,
            image: item.image || "",
            version: version,
            audio: item.type === "sio"
                ? item.audio
                : (version === "original" ? item.collageOriginal : item.collageProcessed)
        });

        /* 自動排序 */
        sortCollageItems();

        const card = document.querySelector(
            `.material-card[data-id="${item.id}"], .sio-card[data-id="${item.id}"]`
        );
        if (card) card.classList.add("selected");

        renderCollage();
        updateSioCardStates();
    }


    /* =================================================
       拼貼區顯示

       使用格狀卡片。
       每張卡片顯示素材名稱與版本。
    ================================================= */

    function renderCollage() {
        dropArea.innerHTML = "";

        if (collageItems.length === 0) {
            const hint = document.createElement("div");
            hint.className = "drop-hint";
            hint.textContent = tr("dropHint");
            dropArea.appendChild(hint);
        }

        collageItems.forEach(item => {
            const div = document.createElement("div");
            div.className = "collage-item";

            const sourceMaterial = item.type === "sio"
                ? sioSongs.find(song => song.id === item.id)
                : materials.find(material => material.id === item.id);
            const displayName = sourceMaterial ? materialName(sourceMaterial) : item.title;
            const versionText = item.type === "sio"
                ? tr("sioRecording")
                : (item.version === "original" ? tr("original") : tr("processedShort"));

            div.innerHTML = `
                ${item.image ? `<img src="${item.image}" alt="${displayName}">` : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--forest);font-weight:bold;font-size:0.72rem;padding:4px;text-align:center;">${displayName}</div>`}

                <div class="collage-item-info">
                    <span class="collage-item-title">${displayName}</span>
                    <span class="collage-item-version">${versionText}</span>
                </div>

                <button class="remove-item" aria-label="${tr("remove")}" title="${tr("remove")}">×</button>
            `;

            div.querySelector(".remove-item").addEventListener("click", () => {
                removeFromCollage(item.id, item.version);
            });

            dropArea.appendChild(div);
        });

        document.getElementById("collageCount").textContent =
            tr("count")(collageItems.length);

        confirmBtn.disabled = collageItems.length === 0;
        updateSioCardStates();
    }


    /* =================================================
       移除拼貼素材

       只移除指定素材的指定版本。
       若另一個版本仍存在，素材格子仍維持選取狀態。
    ================================================= */

    function removeFromCollage(id, version) {
        collageItems = collageItems.filter(
            item => !(item.id === id && item.version === version)
        );

        const card = document.querySelector(
            `.material-card[data-id="${id}"], .sio-card[data-id="${id}"]`
        );

        if (card) {
            const stillSelected = collageItems.some(item => item.id === id);
            card.classList.toggle("selected", stillSelected);
        }

        renderCollage();
        updateSioCardStates();
    }

    clearBtn.addEventListener("click", () => {
        if (collagePlaying) stopCollage();

        collageItems = [];

        document.querySelectorAll(".material-card, .sio-card").forEach(card => {
            card.classList.remove("selected");
        });

        renderCollage();
        updateSioCardStates();
    });


    /* =================================================
       拼貼播放：同步播放各素材的節奏版本
    ================================================= */

    function disposeCollagePlayers() {
        tonePlayers.forEach(player => {
            player.stop();
            player.dispose();
        });

        tonePlayers = [];
    }

    async function startCollage() {
        if (collageItems.length === 0 || collagePlaying) return;

        try {
            await Tone.start();

            Tone.Transport.stop();
            Tone.Transport.cancel();

            disposeCollagePlayers();

            collageItems.forEach(item => {
                const player = new Tone.Player({
                    url: item.audio,
                    loop: true
                }).toDestination();

                player.sync().start(0);
                tonePlayers.push(player);
            });

            await Tone.loaded();

            Tone.Transport.start();

            collagePlaying = true;
            confirmBtn.textContent = tr("stop");
            confirmBtn.classList.add("playing");

        } catch (error) {
            console.error("拼貼播放失敗：", error);
            alert(tr("collageError"));

            Tone.Transport.stop();
            Tone.Transport.cancel();
            disposeCollagePlayers();
        }
    }

    function stopCollage() {
        Tone.Transport.stop();
        Tone.Transport.cancel();

        disposeCollagePlayers();

        collagePlaying = false;
        confirmBtn.textContent = tr("confirm");
        confirmBtn.classList.remove("playing");
    }

    confirmBtn.addEventListener("click", async () => {
        if (collagePlaying) {
            stopCollage();
        } else {
            await startCollage();
        }
    });


    /* =================================================
       初始化
    ================================================= */

    let initialLang = "zh";
    try {
        initialLang = localStorage.getItem("prefLang") || "zh";
    } catch (error) {
        initialLang = "zh";
    }

    if (!languageText[initialLang]) initialLang = "zh";
    setLang(initialLang);

    renderMaterials();

    // renderMaterials() 會新建相褒歌區塊與素材標籤，
    // 因此在 DOM 建立後再次套用語言，確保初始狀態與主頁語言一致。
    setLang(initialLang);

    renderCollage();
    updatePreviewButton();

    /* 每次進入頁面時自動開始操作導覽 */
    openTour();

</script>

</body>
</html>
