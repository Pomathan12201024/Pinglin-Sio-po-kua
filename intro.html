<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>介紹原始素材</title>
    <style>
        body {
            margin: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f5f5f7;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header a {
            text-decoration: none;
            color: #007aff;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }
        .item-card {
            background: white;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            max-width: 500px;
            margin-left: auto;
            margin-right: auto;
        }
        .item-img {
            width: 100%;
            height: 180px;
            background-color: #e5e5ea;
            border-radius: 10px;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .item-title {
            font-size: 1.3rem;
            margin: 0 0 10px 0;
            color: #1c1c1e;
        }
        .item-desc {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 15px;
        }
        .listen-btn {
            display: block;
            text-align: center;
            background-color: #af52de;
            color: white;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html">← 回到主頁</a>
        <h2>認識聲音素材</h2>
    </div>

    <!-- 素材區塊 1 -->
    <div class="item-card">
        <!-- 如果有圖片，可將 src 替換為 images/你的圖片.jpg -->
        <img src="" alt="鼓組圖片" class="item-img">
        <h3 class="item-title">動力鼓組 (Drums)</h3>
        <p class="item-desc">這是整首曲子的心跳。透過強烈的 Kick 與俐落的 Hi-hat 交織，提供穩定的律動基礎。</p>
        <!-- 注意 href 帶了參數 ?sound=drums -->
        <a href="listen.html?sound=drums" class="listen-btn">🎧 前往聆聽</a>
    </div>

    <!-- 素材區塊 2 -->
    <div class="item-card">
        <img src="" alt="合成器圖片" class="item-img">
        <h3 class="item-title">深沉低音 (Sub Bass)</h3>
        <p class="item-desc">填補低頻的空間，使用顆粒感極重的合成器音色，為音樂鋪上一層渾厚的底盤。</p>
        <!-- 注意 href 帶了參數 ?sound=bass -->
        <a href="listen.html?sound=bass" class="listen-btn">🎧 前往聆聽</a>
    </div>

</body>
</html>
