<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>介紹原始素材</title>
    <style>
        body { margin: 0; font-family: 'Helvetica Neue', Arial, sans-serif; background-color: #f5f5f7; padding: 20px; }
        .header { text-align: center; margin-bottom: 30px; position: relative; }
        .header a { text-decoration: none; color: #007aff; font-weight: bold; display: inline-block; margin-bottom: 10px; }
        .item-card { background: white; border-radius: 16px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); max-width: 500px; margin-left: auto; margin-right: auto; }
        .item-img { width: 100%; height: 180px; background-color: #e5e5ea; border-radius: 10px; object-fit: cover; margin-bottom: 15px; }
        .item-title { font-size: 1.3rem; margin: 0 0 10px 0; color: #1c1c1e; }
        .item-desc { color: #666; font-size: 0.95rem; line-height: 1.5; margin-bottom: 15px; }
        .listen-btn { display: block; text-align: center; background-color: #af52de; color: white; text-decoration: none; padding: 12px; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="header">
        <a href="index.html" data-i18n="back">← 回到主頁</a>
        <h2 data-i18n="title">認識聲音素材</h2>
    </div>

    <div class="item-card">
        <img src="" alt="Drums" class="item-img">
        <h3 class="item-title" data-i18n="item1Title">相褒歌鼓組</h3>
        <p class="item-desc" data-i18n="item1Desc">全部都是由採集音製作而成</p>
        <a href="listen.html?sound=drums" class="listen-btn" data-i18n="btnListen">🎧 前往聆聽</a>
    </div>

    <div class="item-card">
        <img src="" alt="lead" class="item-img">
        <h3 class="item-title" data-i18n="item2Title">相褒歌主旋律</h3>
        <p class="item-desc" data-i18n="item2Desc">簡易旋律</p>
        <a href="listen.html?sound=lead" class="listen-btn" data-i18n="btnListen">🎧 前往聆聽</a>
    </div>

    <div class="item-card">
        <img src="" alt="lead" class="item-img">
        <h3 class="item-title" data-i18n="item3Title">坪林河流</h3>
        <p class="item-desc" data-i18n="item3Desc">河流</p>
        <a href="listen.html?sound=pad" class="listen-btn" data-i18n="btnListen">🎧 前往聆聽</a>
    </div>

    <script>
        const dict = {
            'zh': {
                'back': '← 回到主頁',
                'title': '認識聲音素材',
                'item1Title': '相褒歌鼓組',
                'item1Desc': '全部都是由採集音製作而成',
                'item2Title': '相褒歌主旋律',
                'item2Desc': '簡易旋律',
                'item3Title': '坪林河流',
                'item3Desc': '河流',
                'btnListen': '🎧 前往聆聽'
            },
            'en': {
                'back': '← Back to Home',
                'title': 'Meet the Sounds',
                'item1Title': 'sio po kua Drums',
                'item1Desc': 'ok',
                'item2Title': 'sio po kua lead',
                'item2Desc': 'ok',
                'item3Title': 'Pimglin river',
                'item3Desc': 'ok',
                'btnListen': '🎧 Listen'
            }
        };

        const savedLang = localStorage.getItem('prefLang') || 'zh';
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if(dict[savedLang][key]) el.innerText = dict[savedLang][key];
        });
    </script>
</body>
</html>
